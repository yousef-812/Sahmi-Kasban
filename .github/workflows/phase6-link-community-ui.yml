name: Phase 6 Community Navigation Linker

on:
  pull_request:

permissions:
  contents: write

jobs:
  link-community:
    if: github.head_ref == 'agent/phase-6-community-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Link community routes and dashboard tab
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('mobile/lib/app/router.dart')
          text = router.read_text()
          import_anchor = "import '../features/bootstrap/splash_screen.dart';\n"
          community_imports = (
              "import '../features/community/community_create_screen.dart';\n"
              "import '../features/community/community_detail_screen.dart';\n"
              "import '../features/community/my_discussions_screen.dart';\n"
          )
          if community_imports not in text:
              if import_anchor not in text:
                  raise SystemExit('Router import anchor not found')
              text = text.replace(
                  import_anchor,
                  import_anchor + community_imports,
                  1,
              )

          reports_anchor = (
              "      GoRoute(\n"
              "        path: '/reports/:reportId',\n"
          )
          community_routes = (
              "      GoRoute(\n"
              "        path: '/community/new',\n"
              "        builder: (context, state) => const CommunityCreateScreen(),\n"
              "      ),\n"
              "      GoRoute(\n"
              "        path: '/community/mine',\n"
              "        builder: (context, state) => const MyDiscussionsScreen(),\n"
              "      ),\n"
              "      GoRoute(\n"
              "        path: '/community/:discussionId',\n"
              "        builder: (context, state) => CommunityDetailScreen(\n"
              "          discussionId: state.pathParameters['discussionId']!,\n"
              "        ),\n"
              "      ),\n"
          )
          if "path: '/community/new'" not in text:
              if reports_anchor not in text:
                  raise SystemExit('Router reports anchor not found')
              text = text.replace(
                  reports_anchor,
                  community_routes + reports_anchor,
                  1,
              )
          router.write_text(text)

          dashboard = Path('mobile/lib/features/home/dashboard_screen.dart')
          text = dashboard.read_text()
          dashboard_import = "import '../auth/session_controller.dart';\n"
          community_import = "import '../community/community_feed_tab.dart';\n"
          if community_import not in text:
              if dashboard_import not in text:
                  raise SystemExit('Dashboard import anchor not found')
              text = text.replace(
                  dashboard_import,
                  dashboard_import + community_import,
                  1,
              )

          old_titles = (
              "  static const _titles = <String>"
              "['الرئيسية', 'تحليل سهم', 'المحفظة', 'حسابي'];"
          )
          new_titles = (
              "  static const _titles = <String>["
              "'الرئيسية', 'تحليل سهم', 'المجتمع', 'المحفظة', 'حسابي'];"
          )
          if "'المجتمع'" not in text:
              if old_titles not in text:
                  raise SystemExit('Dashboard titles anchor not found')
              text = text.replace(old_titles, new_titles, 1)

          analysis_child = "          StockAnalysisTab(),\n"
          community_child = "          CommunityFeedTab(),\n"
          if community_child not in text:
              if analysis_child not in text:
                  raise SystemExit('Dashboard child anchor not found')
              text = text.replace(
                  analysis_child,
                  analysis_child + community_child,
                  1,
              )

          wallet_destination = (
              "          NavigationDestination(\n"
              "            icon: Icon(Icons.account_balance_wallet_outlined),\n"
          )
          community_destination = (
              "          NavigationDestination(\n"
              "            icon: Icon(Icons.forum_outlined),\n"
              "            selectedIcon: Icon(Icons.forum_rounded),\n"
              "            label: 'المجتمع',\n"
              "          ),\n"
          )
          if "icon: Icon(Icons.forum_outlined)" not in text:
              if wallet_destination not in text:
                  raise SystemExit('Dashboard wallet destination anchor not found')
              text = text.replace(
                  wallet_destination,
                  community_destination + wallet_destination,
                  1,
              )
          dashboard.write_text(text)
          PY
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib mobile/test
          rm .github/workflows/phase6-link-community-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link Phase 6 Flutter community screens'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
