name: Phase 7 Backend Corrections

on:
  pull_request:

permissions:
  contents: write

jobs:
  correct-phase7:
    if: github.head_ref == 'agent/phase-7-prediction-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Correct prediction specificity and API fixture UUID
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('backend/app/services/prediction_evaluation.py')
          text = service.read_text()
          old = '''    is_specific = target_price is not None or bool(deadline) or bool(clean_claims)
              return max(model_specificity, structured_specificity), is_specific
          '''
          new = '''    resolved_specificity = (
              model_specificity if model_specificity > 0 else structured_specificity
          )
              is_specific = target_price is not None or bool(deadline) or bool(clean_claims)
              return resolved_specificity, is_specific
          '''
          if old not in text:
              raise SystemExit('Prediction specificity block not found')
          service.write_text(text.replace(old, new, 1))

          test_path = Path('backend/tests/test_prediction_verification_api.py')
          text = test_path.read_text()
          text = text.replace('from uuid import uuid4', 'from uuid import UUID, uuid4', 1)
          old_return = '    return login.json(), registered.json()["user_id"]\n'
          new_return = '    return login.json(), UUID(registered.json()["user_id"])\n'
          if old_return not in text:
              raise SystemExit('API fixture return block not found')
          test_path.write_text(text.replace(old_return, new_return, 1))
          PY
          rm .github/workflows/phase7-backend-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Phase 7 scoring fixtures'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
