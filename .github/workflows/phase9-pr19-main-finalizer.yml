name: Phase 9 PR19 Scheduled Finalizer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update roadmap and remove temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          old_header = '''> النسخة: 1.8  
          > الحالة: المرحلة 9 قيد التنفيذ؛ PR #18 سجل أداء التقارير مكتمل برمجيًا وPR #19 هو التالي داخل المرحلة  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل + الإدارة والإشعارات + سجل أداء التقارير
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #18: 0، 1، 2، 3، 4، 5، 6، 7، 8  
          > الجزء المنجز على PR #18: Performance Ledger لنتائج تقارير أفضل 10  
          > الخطوة التالية داخل المرحلة 9: PR #19 — إحصاءات وصفحات أداء 7 و30 جلسة  
          > بوابة التحقق الأولى لـPR #18: Workflow `30189154377` — Lint وBackend/PostgreSQL/Alembic نجحت، وبوابة Flutter/APK تعمل على نفس الرأس'''.replace('\n          ', '\n')

          new_header = '''> النسخة: 1.9  
          > الحالة: المرحلة 9 قيد التنفيذ؛ PR #18 وPR #19 مكتملان ومدمجان، وPR #20 هو التالي  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل + الإدارة والإشعارات + سجل أداء التقارير
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #18: 0، 1، 2، 3، 4، 5، 6، 7، 8  
          > الجزء المنجز على PR #18: Performance Ledger لنتائج تقارير أفضل 10  
          > الجزء المنجز على PR #19: إحصاءات وتجربة أداء 7 و30 جلسة مع الإدارة والتصحيحات المدققة  
          > الخطوة التالية داخل المرحلة 9: PR #20 — بوابات الجودة والمراقبة والاستعداد للإطلاق  
          > بوابة التحقق النهائية لـPR #19: Workflow `30191799719` — Lint وBackend/PostgreSQL/Alembic وFlutter وAndroid APK نجحت على الرأس `c5d0798e7cdaea38b9cddb3a6071cfd0158a89db`'''.replace('\n          ', '\n')

          old_phase = '''## المرحلة 9 — سجل الأداء والجودة 🚧 قيد التنفيذ

          ### PR #18 — Performance Ledger ✅ مكتمل برمجيًا

          - [x] سجل تقييم واحد لكل تقرير يومي مكتمل.
          - [x] نتيجة واحدة لكل سهم في التقرير مع الاحتفاظ بالنتائج السلبية.
          - [x] حفظ افتتاح وأعلى وأدنى وإغلاق الجلسة المستهدفة.
          - [x] حساب العائد وأقصى صعود وأقصى هبوط بوحدات basis points ثابتة.
          - [x] تسجيل صحة الاتجاه وتحقيق الهدف الأول والثاني ولمس وقف الخسارة.
          - [x] منع التقييم قبل إغلاق جلسة EGX المستهدفة بتوقيت القاهرة.
          - [x] حالات `pending_data` القابلة لإعادة المحاولة دون تكرار النتائج المكتملة.
          - [x] Backfill للتقارير المستحقة مع حماية صلاحيات الإدارة.
          - [x] Migration واختبارات Service/API/PostgreSQL/Alembic.

          ### PR #19 — Performance Experience (التالي)

          - [ ] تجميع إحصاءات آخر 7 و30 جلسة.
          - [ ] APIs عامة شفافة وصفحات Flutter للأداء.
          - [ ] تفاصيل كل تقرير وأداء الترتيب من 1 إلى 10.
          - [ ] لوحة إدارة للحالات المتأخرة وCSV وتصحيحات البيانات المدققة.

          ### PR #20 — Quality Gates

          - [ ] اختبارات الضغط والأمان.
          - [ ] مراجعة تجربة المستخدم وإمكانية الوصول.
          - [ ] Crash reporting ومراقبة الأداء والتنبيهات.

          ### معيار اكتمال المرحلة 9

          - نتائج الأداء قابلة للتدقيق ولا تستبعد النتائج السلبية.
          - أي تصحيح مكتمل لا يستبدل نتيجة تاريخية بصمت.
          - الأخطاء الحرجة مراقبة وتنبه الفريق.'''.replace('\n          ', '\n')

          new_phase = '''## المرحلة 9 — سجل الأداء والجودة 🚧 قيد التنفيذ

          ### PR #18 — Performance Ledger ✅ مكتمل برمجيًا

          - [x] سجل تقييم واحد لكل تقرير يومي مكتمل.
          - [x] نتيجة واحدة لكل سهم في التقرير مع الاحتفاظ بالنتائج السلبية.
          - [x] حفظ افتتاح وأعلى وأدنى وإغلاق الجلسة المستهدفة.
          - [x] حساب العائد وأقصى صعود وأقصى هبوط بوحدات basis points ثابتة.
          - [x] تسجيل صحة الاتجاه وتحقيق الهدف الأول والثاني ولمس وقف الخسارة.
          - [x] منع التقييم قبل إغلاق جلسة EGX المستهدفة بتوقيت القاهرة.
          - [x] حالات `pending_data` القابلة لإعادة المحاولة دون تكرار النتائج المكتملة.
          - [x] Backfill للتقارير المستحقة مع حماية صلاحيات الإدارة.
          - [x] Migration واختبارات Service/API/PostgreSQL/Alembic.

          ### PR #19 — Performance Experience ✅ مكتمل برمجيًا

          - [x] تجميع إحصاءات آخر 7 و30 جلسة مع نسبة اكتمال البيانات.
          - [x] APIs شفافة وصفحات Flutter للأداء وسجل الجلسات.
          - [x] تفاصيل كل تقرير وأداء الترتيب من 1 إلى 10 مع الاحتفاظ بالنتائج السلبية.
          - [x] لوحة إدارة للحالات المتأخرة وإعادة التقييم وتصدير CSV.
          - [x] تصحيحات OHLC مدققة تحفظ before/after ولا تستبدل التاريخ بصمت.
          - [x] نجاح Lint وBackend/PostgreSQL/Alembic وFlutter tests وAndroid APK في Workflow `30191799719`.

          ### PR #20 — Quality Gates (التالي)

          - [ ] اختبارات الضغط والأمان.
          - [ ] مراجعة تجربة المستخدم وإمكانية الوصول.
          - [ ] Crash reporting ومراقبة الأداء والتنبيهات.

          ### معيار اكتمال المرحلة 9

          - [x] نتائج الأداء قابلة للتدقيق ولا تستبعد النتائج السلبية.
          - [x] أي تصحيح مكتمل لا يستبدل نتيجة تاريخية بصمت.
          - [ ] الأخطاء الحرجة مراقبة وتنبه الفريق.'''.replace('\n          ', '\n')

          replacements = [
              (old_header, new_header, 'roadmap header'),
              (old_phase, new_phase, 'phase 9 section'),
              (
                  '- [~] سجل الأداء والجودة — PR #18 مكتمل برمجيًا؛ PR #19 هو التالي.',
                  '- [~] سجل الأداء والجودة — PR #18 وPR #19 مكتملان ومدمجان؛ PR #20 هو التالي.',
                  'component status',
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected {label}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git show 1b3f04fa3fcfb857a8350f66601e39806823b793:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f PHASE9_PR19_MAIN_TRIGGER.md
          rm -f .github/workflows/phase9-pr19-main-finalizer.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize Phase 9 PR19 roadmap'
          git push origin main

      - name: Close temporary tracking items
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 20 --repo "$GITHUB_REPOSITORY" --comment 'PR #19 roadmap finalization completed.' || true
          gh pr close 21 --repo "$GITHUB_REPOSITORY" --comment 'Temporary finalizer PR is no longer needed.' || true
