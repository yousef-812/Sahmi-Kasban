name: Phase 9 roadmap update

on:
  push:
    branches: [agent/phase-9-performance-ledger]
    paths: [PHASE9_ROADMAP_TRIGGER.md]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9-performance-ledger
      - name: Update roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()
          old_header = '''> النسخة: 1.7  
          > الحالة: المرحلة 8 مكتملة برمجيًا على PR #17، والمرحلة 9 هي التالية  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل + الإدارة والإشعارات
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #17: 0، 1، 2، 3، 4، 5، 6، 7  
          > المرحلة المكتملة على PR #17: 8 — لوحة الإدارة والإشعارات  
          > المرحلة التالية: 9 — سجل الأداء والجودة  
          > بوابة التحقق الأولى للمرحلة 8: Workflow `30185904045` — Lint وBackend/PostgreSQL/Alembic وFlutter وAPK كلها خضراء'''.replace('          ', '')
          new_header = '''> النسخة: 1.8  
          > الحالة: المرحلة 9 قيد التنفيذ؛ PR #18 سجل أداء التقارير مكتمل برمجيًا وPR #19 هو التالي داخل المرحلة  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل + الإدارة والإشعارات + سجل أداء التقارير
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #18: 0، 1، 2، 3، 4، 5، 6، 7، 8  
          > الجزء المنجز على PR #18: Performance Ledger لنتائج تقارير أفضل 10  
          > الخطوة التالية داخل المرحلة 9: PR #19 — إحصاءات وصفحات أداء 7 و30 جلسة  
          > بوابة التحقق الأولى لـPR #18: Workflow `30189154377` — Lint وBackend/PostgreSQL/Alembic نجحت، وبوابة Flutter/APK تعمل على نفس الرأس'''.replace('          ', '')
          old_phase = '''## المرحلة 9 — سجل الأداء والجودة

          ### الأعمال

          - قياس نتائج التقارير اليومية.
          - صفحات أداء 7 و30 جلسة.
          - اختبارات الضغط والأمان.
          - مراجعة تجربة المستخدم.
          - Crash reporting ومراقبة الأداء.

          ### معيار الاكتمال

          - نتائج الأداء قابلة للتدقيق ولا تستبعد النتائج السلبية.
          - الأخطاء الحرجة مراقبة وتنبه الفريق.'''.replace('          ', '')
          new_phase = '''## المرحلة 9 — سجل الأداء والجودة 🚧 قيد التنفيذ

          ### PR #18 — Performance Ledger ✅ مكتمل برمجيًا

          - [x] سجل تقييم واحد لكل تقرير يومي مكتمل.
          - [x] نتيجة واحدة لكل سهم في التقرير مع الاحتفاظ بالنتائج السلبية.
          - [x] حفظ افتتاح وأعلى وأدنى وإغلاق الجلسة المستهدفة.
          - [x] حساب العائد وأقصى صعود وأقصى هبوط بوحدات basis points ثابتة.
          - [x] تسجيل صحة الاتجاه وتحقيق الهدف الأول والثاني ولمس وقف الخسارة.
          - [x] منع التقييم قبل إغلاق جلسة EGX المستهدفة بتوقيت القاهرة.
          - [x] حالات `pending_data` القابلة لإعادة المحاولة دون تكرار النتائج المكتملة.
          - [x] Backfill للتقارير المستحقة مع حماية صلاحيات الإدارة.
          - [x] Migration واختبارات Service/API/PostgreSQL/Alembic.

          ### PR #19 — Performance Experience (التالي)

          - [ ] تجميع إحصاءات آخر 7 و30 جلسة.
          - [ ] APIs عامة شفافة وصفحات Flutter للأداء.
          - [ ] تفاصيل كل تقرير وأداء الترتيب من 1 إلى 10.
          - [ ] لوحة إدارة للحالات المتأخرة وCSV وتصحيحات البيانات المدققة.

          ### PR #20 — Quality Gates

          - [ ] اختبارات الضغط والأمان.
          - [ ] مراجعة تجربة المستخدم وإمكانية الوصول.
          - [ ] Crash reporting ومراقبة الأداء والتنبيهات.

          ### معيار اكتمال المرحلة 9

          - نتائج الأداء قابلة للتدقيق ولا تستبعد النتائج السلبية.
          - أي تصحيح مكتمل لا يستبدل نتيجة تاريخية بصمت.
          - الأخطاء الحرجة مراقبة وتنبه الفريق.'''.replace('          ', '')
          for old, new, label in [
              (old_header, new_header, 'header'),
              (old_phase, new_phase, 'phase block'),
              ('- [ ] سجل الأداء والجودة — المرحلة 9 هي التالية.', '- [~] سجل الأداء والجودة — PR #18 مكتمل برمجيًا؛ PR #19 هو التالي.', 'component status'),
          ]:
              if old not in text:
                  raise SystemExit(f'Missing roadmap {label}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/phase9-roadmap-update.yml PHASE9_ROADMAP_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update roadmap for Phase 9 PR 18"
          git push origin HEAD:agent/phase-9-performance-ledger
