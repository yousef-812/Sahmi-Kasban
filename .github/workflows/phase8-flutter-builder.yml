            Future<Object?> _editSetting(
              BuildContext context,
              OperationalSetting item,
            ) async {
              if (item.kind == 'bool') {
                return showDialog<bool>(
                  context: context,
                  builder: (context) => AlertDialog(
                    title: Text(item.label),
                    content: const Text('اختر حالة الإعداد.'),
