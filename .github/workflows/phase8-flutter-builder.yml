                      TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('إيقاف')),
                      FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('تفعيل')),
                    ],
                  ),
                );
              }
              final controller = TextEditingController(text: item.value.toString());
              return showDialog<Object>(
                context: context,
                builder: (context) => AlertDialog(
                  title: Text(item.label),
                  content: TextField(
                    controller: controller,
                    keyboardType: TextInputType.number,
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('إلغاء')),
                    FilledButton(
                      onPressed: () {
                        final parsed = item.kind == 'float'
                            ? double.tryParse(controller.text)
                            : int.tryParse(controller.text);
