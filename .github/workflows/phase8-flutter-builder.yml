      - name: Install Flutter
        shell: bash
        run: |
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/flutter" config --no-analytics

      - name: Fetch and format Flutter
        working-directory: mobile
        run: |
          $FLUTTER_HOME/bin/flutter pub get
          $FLUTTER_HOME/bin/dart format lib test

      - name: Commit Phase 8 client
        shell: bash
        run: |
          rm PHASE8_BUILD_TRIGGER.md
          rm .github/workflows/phase8-flutter-builder.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend mobile .github/workflows/phase8-flutter-builder.yml PHASE8_BUILD_TRIGGER.md
          git commit -m "Build Phase 8 administration and notification clients"
          git push origin HEAD:agent/phase-8-admin-notifications
