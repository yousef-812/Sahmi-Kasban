          class _BroadcastTab extends ConsumerStatefulWidget {
            const _BroadcastTab();

            @override
            ConsumerState<_BroadcastTab> createState() => _BroadcastTabState();
          }

          class _BroadcastTabState extends ConsumerState<_BroadcastTab> {
            final _title = TextEditingController();
            final _body = TextEditingController();
            bool _busy = false;

            @override
            void dispose() {
              _title.dispose();
              _body.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(20),
                children: [
                  TextField(controller: _title, decoration: const InputDecoration(labelText: 'عنوان الإشعار')),
                  const SizedBox(height: 12),
                  TextField(controller: _body, minLines: 4, maxLines: 8, decoration: const InputDecoration(labelText: 'نص الإشعار')),
                  const SizedBox(height: 18),
                  FilledButton.icon(
                    onPressed: _busy ? null : _send,
                    icon: const Icon(Icons.campaign_outlined),
                    label: const Text('إرسال للمستخدمين النشطين'),
                  ),
                ],
              );
            }

            Future<void> _send() async {
              if (_title.text.trim().length < 3 || _body.text.trim().length < 3) return;
              setState(() => _busy = true);
              try {
                final result = await ref.read(adminRepositoryProvider).broadcast(
                  title: _title.text,
                  body: _body.text,
                );
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('تم إنشاء ${result['notifications_created']} إشعار.')),
                  );
                }
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }
          }

