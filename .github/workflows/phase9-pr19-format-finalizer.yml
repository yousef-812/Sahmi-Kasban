name: Phase 9 PR19 Format Finalizer

on:
  push:
    paths:
      - PHASE9_PR19_FORMAT_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/phase-9-performance-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9-performance-experience
          fetch-depth: 0
      - name: Format Backend and Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet 'ruff>=0.7.4'
          python -m ruff check \
            backend/app backend/tests backend/alembic/env.py backend/scripts \
            backend/reusable_data_fetcher.py \
            --config backend/pyproject.toml --fix

          FLUTTER_HOME="$GITHUB_WORKSPACE/.github/.cache/flutter"
          if [ ! -x "$FLUTTER_HOME/bin/dart" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib mobile/test

          rm -f PHASE9_PR19_FORMAT_TRIGGER.md
          rm -f .github/workflows/phase9-pr19-format-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase 9 performance experience"
          git push origin HEAD:agent/phase-9-performance-experience
