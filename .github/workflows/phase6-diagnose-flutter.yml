name: Phase 6 Flutter Analyzer Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose-flutter:
    if: github.head_ref == 'agent/phase-6-community-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Capture Flutter analyzer output
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          set +e
          "$FLUTTER_HOME/bin/flutter" analyze > ../PHASE6_FLUTTER_ANALYZE.txt 2>&1
          status=$?
          set -e
          cd ..
          printf '\nexit_status=%s\n' "$status" >> PHASE6_FLUTTER_ANALYZE.txt
          rm .github/workflows/phase6-diagnose-flutter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE6_FLUTTER_ANALYZE.txt .github/workflows/phase6-diagnose-flutter.yml
          git commit -m 'Capture Phase 6 Flutter analyzer diagnostics'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
