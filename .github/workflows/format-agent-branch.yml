name: Format feature branch

on:
  push:
    branches: [agent/welcome-economy-signing-report]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/welcome-economy-signing-report
          fetch-depth: 0
      - name: Install Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/flutter/bin/dart" format mobile/lib mobile/test
          rm -f .github/workflows/format-agent-branch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/lib mobile/test .github/workflows/format-agent-branch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Flutter sources"
          git push origin HEAD:agent/welcome-economy-signing-report
