name: Format Phase 12 Flutter

on:
  push:
    branches:
      - agent/free-ads-stock-comparison-v2
    paths:
      - .github/workflows/format-phase12.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-ads-stock-comparison-v2

      - name: Install Flutter
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/flutter" config --no-analytics

      - name: Format mobile sources
        working-directory: mobile
        run: "$FLUTTER_HOME/bin/dart format lib test"

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-phase12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase 12 Flutter sources"
          git push origin HEAD:agent/free-ads-stock-comparison-v2
