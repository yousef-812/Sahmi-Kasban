name: Phase 6 Flutter Community UI Formatter

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-community-ui:
    if: github.head_ref == 'agent/phase-6-community-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Format Phase 6 Flutter UI and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib mobile/test
          rm .github/workflows/phase6-format-community-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format Phase 6 Flutter community UI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
