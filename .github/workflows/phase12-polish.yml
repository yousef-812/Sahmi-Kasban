name: Phase 12 mobile polish

on:
  push:
    branches:
      - agent/free-ads-stock-comparison-v2
    paths:
      - .github/workflows/phase12-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-ads-stock-comparison-v2

      - name: Apply focused mobile edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "mobile/lib/features/monetization/monetization_models.dart",
              """    required this.reportHistoryDays,\n    required this.badgeCode,\n""",
              """    required this.reportHistoryDays,\n    required this.features,\n    required this.comparisonMonthlyAllowance,\n    required this.maxComparisonStocks,\n    required this.priorityLevel,\n    required this.badgeCode,\n""",
          )
          replace(
              "mobile/lib/features/monetization/monetization_models.dart",
              """  final int reportHistoryDays;\n  final String? badgeCode;\n""",
              """  final int reportHistoryDays;\n  final List<String> features;\n  final int comparisonMonthlyAllowance;\n  final int maxComparisonStocks;\n  final int priorityLevel;\n  final String? badgeCode;\n""",
          )
          replace(
              "mobile/lib/features/monetization/monetization_models.dart",
              """      reportHistoryDays: json['report_history_days'] as int,\n      badgeCode: json['badge_code'] as String?,\n""",
              """      reportHistoryDays: json['report_history_days'] as int,\n      features: _list(json['features'])\n          .map((value) => value.toString())\n          .toList(growable: false),\n      comparisonMonthlyAllowance:\n          json['comparison_monthly_allowance'] as int? ?? 0,\n      maxComparisonStocks: json['max_comparison_stocks'] as int? ?? 0,\n      priorityLevel: json['priority_level'] as int? ?? 0,\n      badgeCode: json['badge_code'] as String?,\n""",
          )

          replace(
              "mobile/lib/features/monetization/monetization_screen.dart",
              """            Text('سجل التقارير: ${plan.reportHistoryDays} يوم'),\n            const SizedBox(height: 12),\n""",
              """            Text('سجل التقارير: ${plan.reportHistoryDays} يوم'),\n            if (plan.maxComparisonStocks > 0)\n              Text('مقارنة حتى ${plan.maxComparisonStocks} أسهم'),\n            if (plan.comparisonMonthlyAllowance > 0)\n              Text(\n                '${plan.comparisonMonthlyAllowance} مقارنة متضمنة شهريًا',\n              ),\n            if (plan.features.isNotEmpty) ...[\n              const SizedBox(height: 12),\n              for (final feature in plan.features)\n                Padding(\n                  padding: const EdgeInsets.only(bottom: 6),\n                  child: Row(\n                    crossAxisAlignment: CrossAxisAlignment.start,\n                    children: [\n                      Icon(\n                        Icons.check_circle_outline_rounded,\n                        size: 18,\n                        color: Theme.of(context).colorScheme.primary,\n                      ),\n                      const SizedBox(width: 8),\n                      Expanded(child: Text(feature)),\n                    ],\n                  ),\n                ),\n            ],\n            const SizedBox(height: 12),\n""",
          )

          replace(
              "mobile/lib/features/market/stock_analysis_tab.dart",
              """        ),\n        if (_error != null) ...[\n""",
              """        ),\n        const SizedBox(height: 12),\n        const FreePlanNativeAd(),\n        if (_error != null) ...[\n""",
          )

          replace(
              "mobile/lib/features/home/dashboard_screen.dart",
              """import '../market/stock_analysis_tab.dart';\nimport '../notifications/notification_providers.dart';\n""",
              """import '../market/stock_analysis_tab.dart';\nimport '../monetization/free_plan_ads.dart';\nimport '../notifications/notification_providers.dart';\n""",
          )
          replace(
              "mobile/lib/features/home/dashboard_screen.dart",
              """          const SizedBox(height: 16),\n          const _DisclaimerCard(),\n""",
              """          const SizedBox(height: 16),\n          const FreePlanNativeAd(),\n          const SizedBox(height: 16),\n          const _DisclaimerCard(),\n""",
          )
          replace(
              "mobile/lib/features/home/dashboard_screen.dart",
              """          wallet.when(\n""",
              """          const FreePlanNativeAd(),\n          const SizedBox(height: 12),\n          wallet.when(\n""",
          )
          replace(
              "mobile/lib/features/home/dashboard_screen.dart",
              """        Card(\n          child: Padding(\n""",
              """        const FreePlanNativeAd(),\n        const SizedBox(height: 12),\n        Card(\n          child: Padding(\n""",
          )

          replace(
              "mobile/lib/features/community/community_feed_tab.dart",
              """import '../../core/avatar_assets.dart';\nimport 'community_models.dart';\n""",
              """import '../../core/avatar_assets.dart';\nimport '../monetization/free_plan_ads.dart';\nimport 'community_models.dart';\n""",
          )
          replace(
              "mobile/lib/features/community/community_feed_tab.dart",
              """          const SizedBox(height: 14),\n          feed.when(\n""",
              """          const SizedBox(height: 14),\n          const FreePlanNativeAd(),\n          const SizedBox(height: 14),\n          feed.when(\n""",
          )

          replace(
              "mobile/lib/features/community/community_create_screen.dart",
              """import '../auth/session_controller.dart';\nimport '../wallet/wallet_providers.dart';\n""",
              """import '../auth/session_controller.dart';\nimport '../monetization/free_plan_ads.dart';\nimport '../wallet/wallet_providers.dart';\n""",
          )
          replace(
              "mobile/lib/features/community/community_create_screen.dart",
              """      if (!mounted) {\n        return;\n      }\n      final message = switch (result.discussion.status) {\n""",
              """      if (!mounted) {\n        return;\n      }\n      await ref.read(freePlanInterstitialProvider).recordMeaningfulAction(\n        enabled:\n            ref.read(sessionControllerProvider).profile?.adsEnabled == true,\n      );\n      if (!mounted) {\n        return;\n      }\n      final message = switch (result.discussion.status) {\n""",
          )

          replace(
              "mobile/lib/features/reports/market_report_screen.dart",
              """import '../auth/session_controller.dart';\nimport '../wallet/wallet_providers.dart';\n""",
              """import '../auth/session_controller.dart';\nimport '../monetization/free_plan_ads.dart';\nimport '../wallet/wallet_providers.dart';\n""",
          )
          replace(
              "mobile/lib/features/reports/market_report_screen.dart",
              """      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n          content: Text(\n            execution.chargedPoints == 0\n                ? 'التقرير كان مفتوحًا بالفعل ولم يحدث خصم جديد.'\n                : 'تم فتح التقرير وخصم ${execution.chargedCoins} عملة.',\n          ),\n        ),\n      );\n""",
              """      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n          content: Text(\n            execution.chargedPoints == 0\n                ? 'التقرير كان مفتوحًا بالفعل ولم يحدث خصم جديد.'\n                : 'تم فتح التقرير وخصم ${execution.chargedCoins} عملة.',\n          ),\n        ),\n      );\n      if (execution.chargedPoints > 0) {\n        await ref.read(freePlanInterstitialProvider).recordMeaningfulAction(\n          enabled:\n              ref.read(sessionControllerProvider).profile?.adsEnabled == true,\n        );\n      }\n""",
          )
          replace(
              "mobile/lib/features/reports/market_report_screen.dart",
              """          if (_error != null) _ErrorCard(message: _error!, retry: _unlock),\n""",
              """          const FreePlanNativeAd(),\n          if (_error != null) _ErrorCard(message: _error!, retry: _unlock),\n""",
          )
          replace(
              "mobile/lib/features/reports/market_report_screen.dart",
              """        _MarketSummaryCard(summary: report.marketSummary),\n        for (final item in report.items)\n""",
              """        _MarketSummaryCard(summary: report.marketSummary),\n        const FreePlanNativeAd(),\n        for (final item in report.items)\n""",
          )
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase12-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish plan benefits and free ad placements"
          git push origin HEAD:agent/free-ads-stock-comparison-v2
