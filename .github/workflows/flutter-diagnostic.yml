name: Flutter Analyze Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/flutter-core-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-diagnostic
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Save analyze findings on the source branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          "$FLUTTER_HOME/bin/flutter" analyze > ../FLUTTER_ANALYZE_TEMP.txt 2>&1 || true
          cd ..
          if git diff --quiet -- FLUTTER_ANALYZE_TEMP.txt; then
            echo "Diagnostic file is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FLUTTER_ANALYZE_TEMP.txt
          git commit -m "Record temporary Flutter analyze output"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
