name: Apply Flutter Diagnostic Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-clean:
    if: github.head_ref == 'agent/flutter-core-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-diagnostic
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply import fixes, format, and remove diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "mobile/lib/features/reports/market_report_screen.dart",
              "mobile/lib/features/wallet/wallet_history_screen.dart",
          ):
              path = Path(filename)
              content = path.read_text()
              content = content.replace(
                  "import 'package:intl/intl.dart';",
                  "import 'package:intl/intl.dart' show DateFormat;",
              )
              path.write_text(content)
          PY
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          "$FLUTTER_HOME/bin/dart" format lib test >/dev/null
          cd ..
          rm -f FLUTTER_ANALYZE_TEMP.txt .github/workflows/flutter-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi
          git commit -m "Fix Flutter analyze findings and clean diagnostics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
