name: Phase 8 Flutter Diagnostic

on:
  push:
    branches:
      - agent/phase-8-admin-notifications
    paths:
      - PHASE8_FLUTTER_TRIGGER.md

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-admin-notifications
          fetch-depth: 0
      - name: Apply context guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/admin/admin_dashboard_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if (direction == null) return;\n    await _run(',
              '    if (direction == null || !context.mounted) return;\n    await _run(',
          )
          text = text.replace(
              '                if (value == null) return;\n                await _run(',
              '                if (value == null || !context.mounted) return;\n                await _run(',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - run: |
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
      - working-directory: mobile
        run: |
          $FLUTTER_HOME/bin/flutter pub get
          $FLUTTER_HOME/bin/dart format lib test
          $FLUTTER_HOME/bin/flutter analyze > ../PHASE8_FLUTTER_ANALYZE.txt 2>&1 || true
          tail -n 120 ../PHASE8_FLUTTER_ANALYZE.txt > ../PHASE8_FLUTTER_ANALYZE.tail
          mv ../PHASE8_FLUTTER_ANALYZE.tail ../PHASE8_FLUTTER_ANALYZE.txt
      - run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile PHASE8_FLUTTER_ANALYZE.txt
          git commit -m "Fix Phase 8 Flutter context safety"
          git push origin HEAD:agent/phase-8-admin-notifications
