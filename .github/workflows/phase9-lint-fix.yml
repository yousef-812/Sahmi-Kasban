name: Phase 9 lint fix

on:
  push:
    branches: [agent/phase-9-performance-ledger]
    paths: [PHASE9_LINT_FIX_TRIGGER.md]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9-performance-ledger
      - name: Apply targeted lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/report_performance.py')
          text = path.read_text()
          text = text.replace(
              '    existing = None\n    return MarketReportItemOutcome(',
              '    return MarketReportItemOutcome(',
          )
          text = text.replace(
              '    pending_items = [item for item in items if existing.get(item.id) is None or existing[item.id].status != "complete"]',
              '    pending_items = [\n'
              '        item\n'
              '        for item in items\n'
              '        if existing.get(item.id) is None\n'
              '        or existing[item.id].status != "complete"\n'
              '    ]',
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/phase9-lint-fix.yml PHASE9_LINT_FIX_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 9 Backend lint"
          git push origin HEAD:agent/phase-9-performance-ledger
