name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-local-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Run repository lint script without checkout noise
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/sahmi-source
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${SOURCE_SHA}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/sahmi-source
          GITHUB_WORKSPACE=/tmp/sahmi-source \
          RUN_MODE=lint \
          CI_RESULTS_DIR=/tmp/sahmi-source/.github/.ci-results \
          PIP_CACHE_DIR=/tmp/sahmi-source/.github/.cache/pip \
            bash /tmp/sahmi-source/.github/actions/repository-ci/run.sh

  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local lint
        uses: ./.github/actions/repository-ci
        with:
          mode: lint

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local tests
        uses: ./.github/actions/repository-ci
        with:
          mode: tests
          run-live-smoke: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
