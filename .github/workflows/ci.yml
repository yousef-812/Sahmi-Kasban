name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local lint
        shell: bash
        env:
          RUN_MODE: lint
        run: bash .github/actions/repository-ci/run.sh

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
      RUN_LIVE_SMOKE: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local tests
        shell: bash
        env:
          RUN_MODE: tests
        run: bash .github/actions/repository-ci/run.sh

  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install Flutter inside repository workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Fetch Flutter packages
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter pub get

      - name: Verify Flutter formatting
        working-directory: mobile
        run: $FLUTTER_HOME/bin/dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter test

      - name: Build Android debug APK
        working-directory: mobile
        run: >-
          $FLUTTER_HOME/bin/flutter build apk --debug
          --dart-define=API_BASE_URL=https://example.invalid

  phase5-finalize-roadmap:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-5-monetization' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Record Phase 5 completion
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ROADMAP.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          output: list[str] = []
          warning = (
              "> **تحذير إطلاق:** تم اختبار الإعلانات التجريبية وStub SSV ومسارات "
              "الشراء التجريبية آليًا، لكن لم يتم بعد تنفيذ شراء حقيقي من Google Play "
              "Internal Testing أو استقبال AdMob SSV حي موقّع من وحدة المشروع. تظل "
              "هذه اختبارات قبول إلزامية قبل الإنتاج."
          )
          warning_present = any("تحذير إطلاق" in line for line in lines)

          for line in lines:
              if line.startswith("> النسخة:"):
                  line = "> النسخة: 1.3  "
              elif line.startswith("> الحالة:"):
                  line = "> الحالة: قيد التنفيذ — المراحل 0–4 مكتملة ومدمجة، والمرحلة 5 مكتملة برمجيًا وجاهزة للدمج، والمرحلة 6 هي التالية  "
              elif line.startswith("> المراحل المكتملة والمدمجة:"):
                  line = "> المراحل المكتملة والمدمجة: 0، 1، 2، 3، 4؛ المرحلة 5 مكتملة برمجيًا وجاهزة للدمج  "
              elif line.startswith("> المرحلة التالية:"):
                  line = "> المرحلة التالية: 6 — المجتمع والمناقشات  "
              elif line.startswith("> الفرع المرجعي:"):
                  line = "> الفرع المرجعي: `agent/phase-5-monetization`"
              elif line == "## المرحلة 5 — الإعلانات والاشتراكات":
                  line = "## المرحلة 5 — الإعلانات والاشتراكات ✅ مكتملة برمجيًا"
              elif line == "- [ ] Flutter application — قيد التنفيذ في المرحلة 4.":
                  line = "- [x] Flutter application — المرحلة 4 مكتملة ومدمجة."
              elif line == "- [ ] الإعلانات والاشتراكات المدفوعة.":
                  line = "- [x] الإعلانات والاشتراكات — مكتملة برمجيًا؛ اختبار Google Play وAdMob الحي مؤجل إلى بوابة الإطلاق."

              output.append(line)
              if (
                  not warning_present
                  and line == "- الخطة المجانية تمنح 3 عملات أسبوعيًا وتظل الإعلانات مفعلة."
              ):
                  output.extend(["", warning])
                  warning_present = True

          text = "\n".join(output) + "\n"
          markers = (
              "> النسخة: 1.3",
              "## المرحلة 5 — الإعلانات والاشتراكات ✅ مكتملة برمجيًا",
              "> المرحلة التالية: 6 — المجتمع والمناقشات",
              "تحذير إطلاق",
          )
          missing = [marker for marker in markers if marker not in text]
          if missing:
              raise SystemExit(f"ROADMAP markers missing: {missing}")
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          if git diff --cached --quiet; then
            echo "ROADMAP already finalized"
            exit 0
          fi
          git commit -m "Mark Phase 5 complete in roadmap"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
