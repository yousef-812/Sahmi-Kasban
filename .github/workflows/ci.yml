name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase5-flutter-preflight:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-phase5
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-phase5
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          show-progress: false
      - name: Apply deterministic Flutter preflight and restore CI
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('backend/app/core/config.py')
          text = config.read_text().replace(
              'google_play_package_name: str = "com.sahmikasban.app"',
              'google_play_package_name: str = "com.sahmikasban.sahmi_kasban_mobile"',
          )
          config.write_text(text)

          service = Path('backend/app/services/monetization.py')
          text = service.read_text()
          needle = '''    current_settings = settings or get_settings()
    now = moment or datetime.now(UTC)
    eligibility = rewarded_ad_eligibility(
'''
          replacement = '''    current_settings = settings or get_settings()
    if current_settings.admob_ssv_verification_mode == "disabled":
        raise RewardedAdsUnavailableError("verification_disabled")
    now = moment or datetime.now(UTC)
    eligibility = rewarded_ad_eligibility(
'''
          if 'verification_disabled' not in text:
              if needle not in text:
                  raise SystemExit('Rewarded session insertion point not found')
              text = text.replace(needle, replacement, 1)
          service.write_text(text)

          controller = Path('mobile/lib/features/monetization/monetization_controller.dart')
          text = controller.read_text()
          replacements = [
              (
                  '''            );
          }
        case PurchaseStatus.error:
''',
                  '''            );
          }
          break;
        case PurchaseStatus.error:
''',
              ),
              (
                  '''            );
          }
        case PurchaseStatus.canceled:
''',
                  '''            );
          }
          break;
        case PurchaseStatus.canceled:
''',
              ),
              (
                  '''            );
          }
        case PurchaseStatus.purchased:
''',
                  '''            );
          }
          break;
        case PurchaseStatus.purchased:
''',
              ),
              (
                  '''        case PurchaseStatus.restored:
          await _verifyAndComplete(purchase);
      }
''',
                  '''        case PurchaseStatus.restored:
          await _verifyAndComplete(purchase);
          break;
      }
''',
              ),
          ]
          for old, new in replacements:
              text = text.replace(old, new, 1)
          controller.write_text(text)

          dashboard = Path('mobile/lib/features/home/dashboard_screen.dart')
          text = dashboard.read_text()
          if "context.push('/monetization')" not in text:
              needle = '''                    OutlinedButton.icon(
                      onPressed: () => context.push('/wallet/history'),
                      icon: const Icon(Icons.receipt_long_outlined),
                      label: const Text('عرض سجل العمليات'),
                    ),
'''
              replacement = needle + '''                    const SizedBox(height: 10),
                    FilledButton.icon(
                      onPressed: () => context.push('/monetization'),
                      icon: const Icon(Icons.workspace_premium_outlined),
                      label: const Text('الخطط وشراء العملات'),
                    ),
'''
              if needle not in text:
                  raise SystemExit('Wallet navigation insertion point not found')
              text = text.replace(needle, replacement, 1)
          dashboard.write_text(text)
          PY
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get
          "$FLUTTER_HOME/bin/dart" format lib test
          cd ..
          rm -f .github/workflows/phase5-flutter-preflight.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Phase 5 Flutter monetization integration'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local lint
        shell: bash
        env:
          RUN_MODE: lint
        run: bash .github/actions/repository-ci/run.sh

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
      RUN_LIVE_SMOKE: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local tests
        shell: bash
        env:
          RUN_MODE: tests
        run: bash .github/actions/repository-ci/run.sh

  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install Flutter inside repository workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Fetch Flutter packages
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter pub get

      - name: Verify Flutter formatting
        working-directory: mobile
        run: $FLUTTER_HOME/bin/dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter test
