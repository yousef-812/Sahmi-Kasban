name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local lint
        shell: bash
        env:
          RUN_MODE: lint
        run: bash .github/actions/repository-ci/run.sh

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
      RUN_LIVE_SMOKE: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local tests
        shell: bash
        env:
          RUN_MODE: tests
        run: bash .github/actions/repository-ci/run.sh

  flutter-checks:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'agent/phase-5-monetization' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install Flutter inside repository workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Fetch Flutter packages
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter pub get

      - name: Verify Flutter formatting
        working-directory: mobile
        run: $FLUTTER_HOME/bin/dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter test

      - name: Build Android debug APK
        working-directory: mobile
        run: >-
          $FLUTTER_HOME/bin/flutter build apk --debug
          --dart-define=API_BASE_URL=https://example.invalid

  phase5-apk-diagnostic:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-5-monetization' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-phase5-apk
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-phase5-apk
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Capture Android build output
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          set +e
          "$FLUTTER_HOME/bin/flutter" build apk --debug \
            --dart-define=API_BASE_URL=https://example.invalid \
            > ../PHASE5_ANDROID_BUILD_FULL.log 2>&1
          status=$?
          set -e
          cd ..
          tail -n 180 PHASE5_ANDROID_BUILD_FULL.log > PHASE5_ANDROID_BUILD_TEMP.txt
          printf '\nexit_code=%s\n' "$status" >> PHASE5_ANDROID_BUILD_TEMP.txt
          rm PHASE5_ANDROID_BUILD_FULL.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE5_ANDROID_BUILD_TEMP.txt
          git commit -m "Capture Phase 5 Android build result"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit "$status"
