name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Check core style
        id: core-ruff
        continue-on-error: true
        run: ruff check src tests --output-format json > core-ruff.json
      - name: Upload core Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ruff-report
          path: core-ruff.json
      - run: python -m compileall -q src tests
      - run: pytest -q
      - name: Enforce core Ruff result
        if: steps.core-ruff.outcome == 'failure'
        run: |
          cat core-ruff.json
          exit 1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" -e "backend[dev]"
      - name: Check backend style
        id: backend-ruff
        continue-on-error: true
        run: cd backend && ruff check app tests alembic/env.py --output-format json > ../backend-ruff.json
      - name: Upload backend Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-report
          path: backend-ruff.json
      - run: python -m compileall -q backend/app backend/tests backend/alembic
      - run: pytest -q backend/tests
      - run: cd backend && alembic upgrade head
      - run: cd backend && alembic downgrade base
      - run: cd backend && alembic upgrade head
      - name: Enforce backend Ruff result
        if: steps.backend-ruff.outcome == 'failure'
        run: |
          cat backend-ruff.json
          exit 1
