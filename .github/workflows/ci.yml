name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  autofix-phase-three:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-top10-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Chain the concurrency exception explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/services/daily_reports.py")
          text = path.read_text(encoding="utf-8")
          old = '''    except IntegrityError:\n        db.rollback()\n        raced = _complete_report_for_target(db, session.target_session_date)'''
          new = '''    except IntegrityError as exc:\n        db.rollback()\n        raced = _complete_report_for_target(db, session.target_session_date)'''
          text = text.replace(old, new, 1)
          old_raise = '''        if refreshed_run is None:\n            raise DailyReportGenerationError("Concurrent report has no scan record")'''
          new_raise = '''        if refreshed_run is None:\n            raise DailyReportGenerationError(\n                "Concurrent report has no scan record"\n            ) from exc'''
          text = text.replace(old_raise, new_raise, 1)
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- backend/app/services/daily_reports.py; then
            echo "No change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/daily_reports.py
          git commit -m "Chain daily report integrity errors"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local lint
        shell: bash
        env:
          RUN_MODE: lint
        run: bash .github/actions/repository-ci/run.sh

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
      RUN_LIVE_SMOKE: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run repository-local tests
        shell: bash
        env:
          RUN_MODE: tests
        run: bash .github/actions/repository-ci/run.sh
