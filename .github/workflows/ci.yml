name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  core-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: version
      - name: Check core style
        id: lint
        continue-on-error: true
        run: ruff check src tests --output-format concise > core-ruff.txt 2>&1
      - name: Publish core Ruff diagnostics
        if: github.event_name == 'pull_request' && steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('core-ruff.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- core-ruff-diagnostic -->\n### Core Ruff diagnostics\n\`\`\`text\n${report}\n\`\`\``
            });
      - name: Enforce core Ruff result
        if: steps.lint.outcome == 'failure'
        run: exit 1

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: pytest -q

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: version
      - name: Check backend style
        id: lint
        continue-on-error: true
        run: >-
          ruff check backend/app backend/tests backend/alembic/env.py
          --config backend/pyproject.toml --output-format concise
          > backend-ruff.txt 2>&1
      - name: Publish backend Ruff diagnostics
        if: github.event_name == 'pull_request' && steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend-ruff.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- backend-ruff-diagnostic -->\n### Backend Ruff diagnostics\n\`\`\`text\n${report}\n\`\`\``
            });
      - name: Enforce backend Ruff result
        if: steps.lint.outcome == 'failure'
        run: exit 1

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahmi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahmi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" -e "backend[dev]"
      - run: python -m compileall -q backend/app backend/tests backend/alembic
      - run: pytest -q backend/tests
      - run: cd backend && alembic upgrade head
      - run: cd backend && alembic downgrade base
      - run: cd backend && alembic upgrade head
