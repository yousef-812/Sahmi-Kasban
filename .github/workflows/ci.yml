name: Sahmi Kasban Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
    steps:
      - name: Fetch exact repository revision
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            | tar -xz --strip-components=1

      - name: Run repository-local lint
        shell: bash
        env:
          RUN_MODE: lint
        run: bash .github/actions/repository-ci/run.sh

      - name: Upload repository lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-lint-${{ github.run_id }}
          path: .github/.ci-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  repository-tests:
    needs: repository-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sahmi_test
      PIP_CACHE_DIR: ${{ github.workspace }}/.github/.cache/pip
      CI_RESULTS_DIR: ${{ github.workspace }}/.github/.ci-results
      RUN_LIVE_SMOKE: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/tradingview-provider' }}
    steps:
      - name: Fetch exact repository revision
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            | tar -xz --strip-components=1

      - name: Start repository test database
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --rm \
            --name sahmi-ci-postgres \
            --env POSTGRES_DB=sahmi_test \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --publish 5432:5432 \
            postgres:16-alpine >/dev/null 2>&1
          for attempt in {1..30}; do
            if docker exec sahmi-ci-postgres \
              pg_isready -U postgres -d sahmi_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs sahmi-ci-postgres
          exit 1

      - name: Run repository-local tests
        shell: bash
        env:
          RUN_MODE: tests
        run: bash .github/actions/repository-ci/run.sh

      - name: Stop repository test database
        if: always()
        shell: bash
        run: docker rm --force sahmi-ci-postgres >/dev/null 2>&1 || true

      - name: Upload repository test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tests-${{ github.run_id }}
          path: .github/.ci-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install Flutter inside repository workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Fetch Flutter packages
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter pub get

      - name: Verify Flutter formatting
        working-directory: mobile
        run: $FLUTTER_HOME/bin/dart format --output=none --set-exit-if-changed lib test

      - name: Capture Flutter formatting diff
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          $FLUTTER_HOME/bin/dart format lib test
          git diff -- lib test > "$RUNNER_TEMP/flutter-format.patch"

      - name: Analyze Flutter application
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter test

      - name: Build Android debug APK
        working-directory: mobile
        run: >-
          $FLUTTER_HOME/bin/flutter build apk --debug
          --dart-define=API_BASE_URL=https://example.invalid

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/flutter-format.patch
          if-no-files-found: ignore
          retention-days: 7
