name: Phase 8 Roadmap Finalizer

on:
  push:
    branches:
      - agent/phase-8-admin-notifications
    paths:
      - PHASE8_ROADMAP_TRIGGER.md

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-admin-notifications
          fetch-depth: 0
      - name: Finalize roadmap and operations documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old_header = '''> النسخة: 1.6  
          > الحالة: المرحلة 7 مكتملة برمجيًا على PR #16، والمرحلة 8 هي التالية  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #16: 0، 1، 2، 3، 4، 5، 6  
          > المرحلة المكتملة على PR #16: 7 — تقييم التوقعات والمكافآت  
          > المرحلة التالية: 8 — لوحة الإدارة والإشعارات  
          > بوابة التحقق: Lint وBackend/PostgreSQL/Alembic وFlutter وAPK اجتازت بوابة كاملة على PR #16'''.replace('\n          ', '\n')
          new_header = '''> النسخة: 1.7  
          > الحالة: المرحلة 8 مكتملة برمجيًا على PR #17، والمرحلة 9 هي التالية  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل + الإدارة والإشعارات
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #17: 0، 1، 2، 3، 4، 5، 6، 7  
          > المرحلة المكتملة على PR #17: 8 — لوحة الإدارة والإشعارات  
          > المرحلة التالية: 9 — سجل الأداء والجودة  
          > بوابة التحقق الأولى للمرحلة 8: Workflow `30185904045` — Lint وBackend/PostgreSQL/Alembic وFlutter وAPK كلها خضراء'''.replace('\n          ', '\n')
          if old_header not in text:
              raise RuntimeError('Roadmap header block not found')
          text = text.replace(old_header, new_header, 1)

          old_phase = '''## المرحلة 8 — لوحة الإدارة والإشعارات

          ### الأعمال

          - لوحة الإدارة.
          - البلاغات والحظر.
          - إدارة الأسعار والحدود.
          - مراقبة المزود والـAI.
          - Push Notifications.
          - Audit logs.

          ### معيار الاكتمال

          - يمكن تشغيل المنتج وإدارته دون تعديل الكود لكل تغيير تشغيلي.'''.replace('\n          ', '\n')
          new_phase = '''## المرحلة 8 — لوحة الإدارة والإشعارات ✅ مكتملة برمجيًا

          ### المنجز على PR #17

          - [x] مركز إدارة Flutter محمي يظهر فقط للحسابات الموجودة في `ADMIN_EMAILS`.
          - [x] نظرة عامة للمستخدمين والمراجعة والبلاغات والاستئنافات والتوقعات والرصيد والإشعارات.
          - [x] طابور قبول ورفض المناقشات وحظر الحسابات وإلغاء الحظر من الواجهة.
          - [x] إعدادات تشغيل allowlisted للأسعار ومكافآت الإعلانات وحدود المجتمع مع تحقق نوعي وحدود دنيا وعليا.
          - [x] ربط تكلفة تحليل السهم وفتح التقرير ومكافآت الإعلانات وحدود المناقشات بالقيم التشغيلية على السيرفر.
          - [x] سجل تدقيق غير قابل للتلاعب لكل تعديل إعداد أو بث إشعار أو إجراء إداري.
          - [x] فحص مزود بيانات السوق ومزود AI مع حفظ الحالة والزمن والتفاصيل الآمنة.
          - [x] صندوق إشعارات داخل التطبيق مع حالة قراءة مفردة وقراءة الكل.
          - [x] تسجيل أجهزة Push باستخدام SHA-256 وتشفير token وسجل تسليم لكل جهاز.
          - [x] FCM HTTP v1 بأوضاع `disabled` و`stub` و`live` مع بقاء Inbox فعالًا دون إعداد Firebase حي.
          - [x] بث إداري للمستخدمين النشطين مع إحصاءات sent/failed/skipped.
          - [x] اختبارات Backend/API وFlutter models وRepository Lint وPostgreSQL/Alembic وAndroid APK.

          ### معيار الاكتمال

          - [x] لا يمكن لمستخدم عادي الوصول إلى أي Admin API أو مسار Flutter الإداري.
          - [x] يمكن تعديل القيم التشغيلية المدعومة دون تغيير الكود أو كشف الأسرار.
          - [x] كل إعداد أو حظر أو بث له Audit trail.
          - [x] الإشعار يُحفظ قبل Push وفشل FCM لا يفقد رسالة المستخدم.
          - [x] مفاتيح Firebase وService Account لا توجد داخل Flutter أو المستودع.
          - [x] نجاح البوابة الكاملة وبناء Android APK — Workflow `30185904045`.

          > **تحذير إطلاق Push:** تم اختبار Inbox وتسجيل الأجهزة وStub delivery آليًا. يلزم قبل الإنتاج إضافة ملفات Firebase الخاصة بالمشروع، وضبط `FCM_PROJECT_ID` و`FCM_SERVICE_ACCOUNT_JSON` كأسرار، وتنفيذ إرسال حي إلى جهاز حقيقي.'''.replace('\n          ', '\n')
          if old_phase not in text:
              raise RuntimeError('Phase 8 roadmap block not found')
          text = text.replace(old_phase, new_phase, 1)
          text = text.replace(
              '- [x] تقييم التوقعات والمكافآت — مكتملة ومتحققة على PR #16؛ المرحلة 8 هي التالية.\n'
              '- [ ] لوحة الإدارة والإشعارات — Backend إدارة المجتمع منفذ جزئيًا داخل المرحلة 6؛ اللوحة المرئية والإشعارات متبقية.\n'
              '- [ ] سجل الأداء والجودة.',
              '- [x] تقييم التوقعات والمكافآت — مكتملة ومتحققة على PR #16.\n'
              '- [x] لوحة الإدارة والإشعارات — مكتملة برمجيًا ومتحققة على PR #17؛ اختبار FCM الحي مؤجل إلى بوابة الإطلاق.\n'
              '- [ ] سجل الأداء والجودة — المرحلة 9 هي التالية.',
              1,
          )
          roadmap.write_text(text, encoding='utf-8')

          log = Path('IMPLEMENTATION_LOG_PHASE_8.md')
          log_text = log.read_text(encoding='utf-8')
          log_text = log_text.replace(
              '- The implementation remains on a Draft pull request until repository lint, Backend/PostgreSQL/Alembic tests, Flutter format/analyze/tests, and Android debug APK build pass on a final normal commit.',
              '- The first complete validation gate passed on Workflow `30185904045`: repository lint, Backend/Core/PostgreSQL tests, Alembic upgrade/downgrade/rebuild, Flutter format/analyze/tests, and Android debug APK all succeeded.\n- A final normal commit must pass the same gate before PR #17 leaves Draft and merges.',
          )
          log.write_text(log_text, encoding='utf-8')

          env_example = Path('backend/.env.example')
          env_text = env_example.read_text(encoding='utf-8')
          if 'FCM_DELIVERY_MODE=' not in env_text:
              env_text += '''

          # Push notifications: disabled, stub, or live.
          FCM_DELIVERY_MODE=disabled
          FCM_PROJECT_ID=
          # JSON text or a mounted JSON file path. Keep this value secret in live environments.
          FCM_SERVICE_ACCOUNT_JSON=
          '''.replace('\n          ', '\n')
          env_example.write_text(env_text, encoding='utf-8')
          PY
      - name: Commit roadmap completion
        run: |
          rm PHASE8_ROADMAP_TRIGGER.md
          rm .github/workflows/phase8-roadmap-finalizer.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md IMPLEMENTATION_LOG_PHASE_8.md backend/.env.example .github/workflows/phase8-roadmap-finalizer.yml PHASE8_ROADMAP_TRIGGER.md
          git commit -m "Mark Phase 8 complete in the roadmap"
          git push origin HEAD:agent/phase-8-admin-notifications
