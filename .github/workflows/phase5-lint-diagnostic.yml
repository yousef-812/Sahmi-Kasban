name: Phase 5 Lint Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose-lint:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Capture exact Ruff output and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q 'ruff>=0.7'
          set +e
          python -m ruff check \
            backend/app backend/tests backend/alembic/env.py backend/scripts \
            backend/reusable_data_fetcher.py \
            --config backend/pyproject.toml \
            --output-format concise > PHASE5_LINT_RESULT.txt 2>&1
          status=$?
          set -e
          printf '\nexit_code=%s\n' "$status" >> PHASE5_LINT_RESULT.txt
          rm .github/workflows/phase5-lint-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE5_LINT_RESULT.txt .github/workflows/phase5-lint-diagnostic.yml
          git commit -m 'Capture exact Phase 5 lint result'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
