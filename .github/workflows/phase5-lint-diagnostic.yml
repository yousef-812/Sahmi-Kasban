name: Phase 5 Lint Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-lint:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Backend compile only
        run: >-
          python -m compileall -q backend/app backend/tests backend/alembic
          backend/scripts backend/reusable_data_fetcher.py
      - name: Backend Ruff only
        run: |
          python -m pip install -q 'ruff>=0.7'
          python -m ruff check \
            backend/app backend/tests backend/alembic/env.py backend/scripts \
            backend/reusable_data_fetcher.py \
            --config backend/pyproject.toml \
            --output-format concise
