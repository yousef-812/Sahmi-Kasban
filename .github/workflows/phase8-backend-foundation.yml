          'backend/app/schemas/operations.py': '''from __future__ import annotations

          from datetime import datetime
          from typing import Any, Literal
          from uuid import UUID

          from pydantic import BaseModel, Field, field_validator, model_validator

          SettingValue = int | float | bool | str
          PushPlatform = Literal["android", "ios", "web"]
          BroadcastAudience = Literal["all", "active", "plan", "user_ids"]


          class OperationalSettingResponse(BaseModel):
              key: str
              category: str
              label: str
              description: str
              kind: str
              value: SettingValue
              default_value: SettingValue
              min_value: int | float | None
              max_value: int | float | None
              updated_at: datetime | None


          class OperationalSettingsResponse(BaseModel):
              items: list[OperationalSettingResponse]


          class OperationalSettingUpdateRequest(BaseModel):
              value: SettingValue


          class AdminOverviewResponse(BaseModel):
              users_total: int = Field(ge=0)
              users_active: int = Field(ge=0)
              users_suspended: int = Field(ge=0)
              discussions_pending: int = Field(ge=0)
              discussions_published: int = Field(ge=0)
              discussions_hidden: int = Field(ge=0)
              open_reports: int = Field(ge=0)
              open_appeals: int = Field(ge=0)
              verified_predictions: int = Field(ge=0)
              wallet_points_total: int
              notifications_today: int = Field(ge=0)
              unread_notifications: int = Field(ge=0)


          class AdminUserListItem(BaseModel):
              id: UUID
              email: str
              display_name: str
              status: str
              plan_code: str
              balance_points: int
              discussions_count: int = Field(ge=0)
              created_at: datetime


          class AdminUserListResponse(BaseModel):
              items: list[AdminUserListItem]
              total: int = Field(ge=0)
              limit: int = Field(gt=0)
              offset: int = Field(ge=0)


          class AdminAuditEventResponse(BaseModel):
              id: UUID
              actor_user_id: UUID | None
              target_user_id: UUID | None
              discussion_id: UUID | None
              action: str
              reason_code: str | None
              details: dict
              created_at: datetime


          class AdminAuditListResponse(BaseModel):
              items: list[AdminAuditEventResponse]
              total: int = Field(ge=0)
              limit: int = Field(gt=0)
              offset: int = Field(ge=0)


          class ServiceHealthResponse(BaseModel):
              id: UUID
              component: str
              provider: str
              status: str
              latency_ms: int | None
              details: dict
              observed_at: datetime


          class ServiceHealthListResponse(BaseModel):
              items: list[ServiceHealthResponse]


          class PushDeviceRegisterRequest(BaseModel):
              token: str = Field(min_length=20, max_length=4096)
              platform: PushPlatform

              @field_validator("token")
              @classmethod
              def normalize_token(cls, value: str) -> str:
                  return value.strip()


          class PushDeviceResponse(BaseModel):
              id: UUID
              platform: PushPlatform
              enabled: bool
              last_seen_at: datetime
              idempotent: bool


          class PushDeviceUnregisterRequest(BaseModel):
              token: str = Field(min_length=20, max_length=4096)


          class NotificationResponse(BaseModel):
              id: UUID
              title: str
              body: str
              category: str
              data: dict
              read_at: datetime | None
              sent_at: datetime


          class NotificationListResponse(BaseModel):
              items: list[NotificationResponse]
              total: int = Field(ge=0)
              unread_count: int = Field(ge=0)
              limit: int = Field(gt=0)
              offset: int = Field(ge=0)


          class NotificationReadResponse(BaseModel):
              notification_id: UUID
              read: bool
              idempotent: bool


          class NotificationReadAllResponse(BaseModel):
              updated: int = Field(ge=0)


          class AdminBroadcastRequest(BaseModel):
              title: str = Field(min_length=3, max_length=180)
              body: str = Field(min_length=3, max_length=1000)
              category: str = Field(default="announcement", min_length=2, max_length=40)
              data: dict[str, Any] = Field(default_factory=dict)
              audience: BroadcastAudience = "active"
              plan_code: str | None = Field(default=None, max_length=32)
              user_ids: list[UUID] = Field(default_factory=list, max_length=500)

              @field_validator("title", "body", "category")
              @classmethod
              def normalize_text(cls, value: str) -> str:
                  return value.strip()

              @model_validator(mode="after")
              def validate_audience(self) -> AdminBroadcastRequest:
                  if self.audience == "plan" and not self.plan_code:
                      raise ValueError("Plan audience requires plan_code")
                  if self.audience == "user_ids" and not self.user_ids:
                      raise ValueError("user_ids audience requires at least one user")
                  return self


          class AdminBroadcastResponse(BaseModel):
              targeted_users: int = Field(ge=0)
              notifications_created: int = Field(ge=0)
              push_sent: int = Field(ge=0)
              push_failed: int = Field(ge=0)
              push_skipped: int = Field(ge=0)
          ''',
          'backend/app/services/operations_settings.py': '''from __future__ import annotations

          from dataclasses import dataclass
          from typing import Literal
          from uuid import UUID

          from sqlalchemy import select
          from sqlalchemy.orm import Session

          from app.core.config import get_settings
          from app.models import AppSetting, CommunityAdminEvent

          SettingKind = Literal["int", "float", "bool", "str"]


          class OperationalSettingError(ValueError):
              """Raised when an operational setting is unknown or invalid."""


          @dataclass(frozen=True, slots=True)
          class SettingDefinition:
              key: str
              category: str
              label: str
              description: str
              kind: SettingKind
              default_value: object
              min_value: int | float | None = None
              max_value: int | float | None = None


          def _definitions() -> tuple[SettingDefinition, ...]:
              settings = get_settings()
              return (
                  SettingDefinition(
                      "analysis_cost_points",
                      "pricing",
                      "تكلفة تحليل السهم",
                      "عدد النقاط المخصومة عند إنشاء تحليل جديد غير مخزن.",
                      "int",
                      settings.analysis_cost_points,
                      1,
                      10_000,
                  ),
                  SettingDefinition(
                      "daily_report_cost_points",
                      "pricing",
                      "تكلفة فتح التقرير اليومي",
                      "عدد النقاط المخصومة لفتح تقرير أفضل الأسهم.",
                      "int",
                      settings.daily_report_cost_points,
                      1,
                      10_000,
                  ),
                  SettingDefinition(
                      "discussion_cost_points",
                      "pricing",
                      "تكلفة نشر المناقشة",
                      "الحجز المؤقت الذي يتحول إلى خصم عند قبول المناقشة.",
                      "int",
                      50,
                      1,
                      5_000,
                  ),
                  SettingDefinition(
                      "ad_reward_points",
                      "rewards",
                      "مكافأة الإعلان",
                      "عدد النقاط المضافة بعد تحقق مشاهدة الإعلان.",
                      "int",
                      settings.ad_reward_points,
                      1,
                      5_000,
                  ),
                  SettingDefinition(
                      "ad_reward_daily_limit",
                      "limits",
                      "الحد اليومي للإعلانات",
                      "أقصى عدد مكافآت إعلانية لكل مستخدم في يوم القاهرة.",
                      "int",
                      settings.ad_reward_daily_limit,
                      1,
                      50,
                  ),
                  SettingDefinition(
                      "ad_reward_cooldown_seconds",
                      "limits",
                      "فاصل الإعلانات بالثواني",
                      "المدة الدنيا بين جلستي إعلان مكافئتين.",
                      "int",
                      settings.ad_reward_cooldown_seconds,
                      0,
                      86_400,
                  ),
                  SettingDefinition(
                      "community_short_window_minutes",
                      "limits",
                      "نافذة الإرسال القصيرة",
                      "عدد الدقائق المستخدمة لحساب حد مناقشات المدى القصير.",
                      "int",
                      15,
                      1,
                      1_440,
                  ),
                  SettingDefinition(
                      "community_short_window_limit",
                      "limits",
                      "حد المناقشات القصير",
                      "أقصى عدد مناقشات داخل النافذة القصيرة.",
                      "int",
                      3,
                      1,
                      100,
                  ),
                  SettingDefinition(
                      "community_daily_limit",
                      "limits",
                      "حد المناقشات اليومي",
                      "أقصى عدد مناقشات للمستخدم خلال 24 ساعة.",
                      "int",
                      10,
                      1,
                      500,
                  ),
                  SettingDefinition(
                      "notifications_enabled",
                      "features",
                      "الإشعارات مفعلة",
                      "السماح بإنشاء إشعارات جديدة وإرسال Push عند توفر FCM.",
                      "bool",
                      True,
                  ),
              )


          def setting_definitions() -> dict[str, SettingDefinition]:
              return {item.key: item for item in _definitions()}


          def _validate_value(definition: SettingDefinition, value: object) -> object:
              if definition.kind == "bool":
                  if not isinstance(value, bool):
                      raise OperationalSettingError(f"{definition.key} must be boolean")
                  return value
              if definition.kind == "int":
                  if isinstance(value, bool) or not isinstance(value, int):
                      raise OperationalSettingError(f"{definition.key} must be an integer")
              elif definition.kind == "float":
                  if isinstance(value, bool) or not isinstance(value, (int, float)):
                      raise OperationalSettingError(f"{definition.key} must be numeric")
                  value = float(value)
              elif definition.kind == "str":
                  if not isinstance(value, str):
                      raise OperationalSettingError(f"{definition.key} must be text")
                  value = value.strip()
              if definition.min_value is not None and value < definition.min_value:
                  raise OperationalSettingError(
                      f"{definition.key} must be at least {definition.min_value}"
                  )
              if definition.max_value is not None and value > definition.max_value:
                  raise OperationalSettingError(
                      f"{definition.key} must be at most {definition.max_value}"
                  )
              return value


          def get_setting_value(db: Session, key: str) -> object:
              definition = setting_definitions().get(key)
              if definition is None:
                  raise OperationalSettingError(f"Unknown operational setting: {key}")
              stored = db.get(AppSetting, key)
              return definition.default_value if stored is None else stored.value


          def get_int_setting(db: Session, key: str) -> int:
              value = get_setting_value(db, key)
              if isinstance(value, bool) or not isinstance(value, int):
                  raise OperationalSettingError(f"{key} is not an integer setting")
              return value


          def get_bool_setting(db: Session, key: str) -> bool:
              value = get_setting_value(db, key)
              if not isinstance(value, bool):
                  raise OperationalSettingError(f"{key} is not a boolean setting")
              return value


          def list_operational_settings(db: Session) -> list[tuple[SettingDefinition, AppSetting | None]]:
              stored = {
                  item.key: item
                  for item in db.scalars(select(AppSetting)).all()
              }
              return [(definition, stored.get(definition.key)) for definition in _definitions()]


          def update_operational_setting(
              db: Session,
              *,
              admin_user_id: UUID,
              key: str,
              value: object,
          ) -> AppSetting:
              definition = setting_definitions().get(key)
              if definition is None:
                  raise OperationalSettingError(f"Unknown operational setting: {key}")
              normalized = _validate_value(definition, value)
              setting = db.get(AppSetting, key)
              previous_value = definition.default_value if setting is None else setting.value
              if setting is None:
                  setting = AppSetting(
                      key=definition.key,
                      category=definition.category,
                      value=normalized,
                      description=definition.description,
                      updated_by_user_id=admin_user_id,
                  )
                  db.add(setting)
              else:
                  setting.value = normalized
                  setting.category = definition.category
                  setting.description = definition.description
                  setting.updated_by_user_id = admin_user_id
              db.add(
                  CommunityAdminEvent(
                      actor_user_id=admin_user_id,
                      action="operational_setting_updated",
                      reason_code=None,
                      details={
                          "key": key,
                          "previous_value": previous_value,
                          "new_value": normalized,
                      },
                  )
              )
              db.flush()
              return setting
          ''',
          'backend/app/services/notifications.py': '''from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          from dataclasses import dataclass
          from datetime import UTC, datetime
          from pathlib import Path
          from uuid import UUID

          from cryptography.fernet import Fernet
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account
          from sqlalchemy import func, select
          from sqlalchemy.orm import Session

          from app.core.config import get_settings
          from app.models import (
              CommunityAdminEvent,
              Notification,
              NotificationDelivery,
              PushDevice,
              Subscription,
              User,
          )
          from app.services.operations_settings import get_bool_setting


          class NotificationError(RuntimeError):
              """Base notification operation error."""


          class NotificationNotFoundError(NotificationError):
              """Raised when a notification does not belong to the user."""


          @dataclass(frozen=True, slots=True)
          class PushDeviceRegistrationResult:
              device: PushDevice
              idempotent: bool


          @dataclass(frozen=True, slots=True)
          class BroadcastResult:
              targeted_users: int
              notifications_created: int
              push_sent: int
              push_failed: int
              push_skipped: int


          def _token_hash(token: str) -> str:
              return hashlib.sha256(token.encode("utf-8")).hexdigest()


          def _token_cipher() -> Fernet:
              secret = get_settings().secret_key.encode("utf-8")
              key = base64.urlsafe_b64encode(hashlib.sha256(secret).digest())
              return Fernet(key)


          def _encrypt_token(token: str) -> str:
              return _token_cipher().encrypt(token.encode("utf-8")).decode("ascii")


          def _decrypt_token(token: str) -> str:
              return _token_cipher().decrypt(token.encode("ascii")).decode("utf-8")


          def register_push_device(
              db: Session,
              *,
              user_id: UUID,
              token: str,
              platform: str,
              moment: datetime | None = None,
          ) -> PushDeviceRegistrationResult:
              current = moment or datetime.now(UTC)
              digest = _token_hash(token)
              device = db.scalar(
                  select(PushDevice)
                  .where(PushDevice.token_hash == digest)
                  .with_for_update()
              )
              if device is not None:
                  idempotent = (
                      device.user_id == user_id
                      and device.platform == platform
                      and device.enabled
                  )
                  device.user_id = user_id
                  device.platform = platform
                  device.encrypted_token = _encrypt_token(token)
                  device.enabled = True
                  device.last_seen_at = current
                  device.last_error = None
                  db.flush()
                  return PushDeviceRegistrationResult(device=device, idempotent=idempotent)
              device = PushDevice(
                  user_id=user_id,
                  token_hash=digest,
                  encrypted_token=_encrypt_token(token),
                  platform=platform,
                  enabled=True,
                  last_seen_at=current,
              )
              db.add(device)
              db.flush()
              return PushDeviceRegistrationResult(device=device, idempotent=False)


          def unregister_push_device(
              db: Session,
              *,
              user_id: UUID,
              token: str,
          ) -> bool:
              device = db.scalar(
                  select(PushDevice)
                  .where(
                      PushDevice.user_id == user_id,
                      PushDevice.token_hash == _token_hash(token),
                  )
                  .with_for_update()
              )
              if device is None or not device.enabled:
                  return False
              device.enabled = False
              db.flush()
              return True


          def create_notification(
              db: Session,
              *,
              user_id: UUID,
              title: str,
              body: str,
              category: str,
              data: dict | None = None,
              moment: datetime | None = None,
          ) -> Notification:
              current = moment or datetime.now(UTC)
              notification = Notification(
                  user_id=user_id,
                  title=title.strip(),
                  body=body.strip(),
                  category=category.strip(),
                  data=data or {},
                  sent_at=current,
              )
              db.add(notification)
              db.flush()
              return notification


          def list_user_notifications(
              db: Session,
              *,
              user_id: UUID,
              limit: int = 20,
              offset: int = 0,
          ) -> tuple[list[Notification], int, int]:
              filters = [Notification.user_id == user_id]
              total = int(db.scalar(select(func.count(Notification.id)).where(*filters)) or 0)
              unread = int(
                  db.scalar(
                      select(func.count(Notification.id)).where(
                          *filters,
                          Notification.read_at.is_(None),
                      )
                  )
                  or 0
              )
              items = db.scalars(
                  select(Notification)
                  .where(*filters)
                  .order_by(Notification.sent_at.desc(), Notification.id.desc())
                  .limit(limit)
                  .offset(offset)
              ).all()
              return list(items), total, unread


          def mark_notification_read(
              db: Session,
              *,
              user_id: UUID,
              notification_id: UUID,
              moment: datetime | None = None,
          ) -> tuple[Notification, bool]:
              notification = db.scalar(
                  select(Notification)
                  .where(
                      Notification.id == notification_id,
                      Notification.user_id == user_id,
                  )
                  .with_for_update()
              )
              if notification is None:
                  raise NotificationNotFoundError("Notification does not exist")
              if notification.read_at is not None:
                  return notification, True
              notification.read_at = moment or datetime.now(UTC)
              db.flush()
              return notification, False


          def mark_all_notifications_read(
              db: Session,
              *,
              user_id: UUID,
              moment: datetime | None = None,
          ) -> int:
              current = moment or datetime.now(UTC)
              items = db.scalars(
                  select(Notification)
                  .where(
                      Notification.user_id == user_id,
                      Notification.read_at.is_(None),
                  )
                  .with_for_update()
              ).all()
              for item in items:
                  item.read_at = current
              db.flush()
              return len(items)


          class FCMPushSender:
              def __init__(self) -> None:
                  self.mode = os.getenv("FCM_DELIVERY_MODE", "disabled").strip().lower()
                  self.project_id = os.getenv("FCM_PROJECT_ID", "").strip()
                  self.service_account_json = os.getenv(
                      "FCM_SERVICE_ACCOUNT_JSON", ""
                  ).strip()

              def _credentials(self):
                  raw = self.service_account_json
                  if not raw:
                      raise NotificationError("FCM service account is not configured")
                  path = Path(raw)
                  if path.exists():
                      info = json.loads(path.read_text(encoding="utf-8"))
                  else:
                      info = json.loads(raw)
                  return service_account.Credentials.from_service_account_info(
                      info,
                      scopes=["https://www.googleapis.com/auth/firebase.messaging"],
                  )

              def send(
                  self,
                  *,
                  token: str,
                  title: str,
                  body: str,
                  data: dict,
              ) -> tuple[str, str | None, str | None]:
                  if self.mode == "disabled":
                      return "skipped", None, "push_disabled"
                  if self.mode == "stub":
                      message_id = "stub:" + hashlib.sha256(token.encode()).hexdigest()[:16]
                      return "sent", message_id, None
                  if self.mode != "live":
                      return "failed", None, "invalid_fcm_mode"
                  if not self.project_id:
                      return "failed", None, "missing_fcm_project_id"
                  try:
                      session = AuthorizedSession(self._credentials())
                      response = session.post(
                          "https://fcm.googleapis.com/v1/projects/"
                          f"{self.project_id}/messages:send",
                          json={
                              "message": {
                                  "token": token,
                                  "notification": {"title": title, "body": body},
                                  "data": {str(key): str(value) for key, value in data.items()},
                              }
                          },
                          timeout=20,
                      )
                      if response.status_code >= 400:
                          return "failed", None, f"fcm_http_{response.status_code}"
                      payload = response.json()
                      return "sent", str(payload.get("name") or ""), None
                  except Exception as exc:  # provider boundary
                      return "failed", None, type(exc).__name__[:120]


          def _target_users(
              db: Session,
              *,
              audience: str,
              plan_code: str | None,
              user_ids: list[UUID],
          ) -> list[User]:
              query = select(User).where(User.status == "active")
              if audience == "plan":
                  query = query.join(
                      Subscription,
                      Subscription.user_id == User.id,
                  ).where(
                      Subscription.status == "active",
                      Subscription.plan_code == plan_code,
                  )
              elif audience == "user_ids":
                  query = query.where(User.id.in_(user_ids))
              return list(db.scalars(query.order_by(User.id).limit(5_000)).all())


          def broadcast_notifications(
              db: Session,
              *,
              admin_user_id: UUID,
              title: str,
              body: str,
              category: str,
              data: dict,
              audience: str,
              plan_code: str | None,
              user_ids: list[UUID],
              sender: FCMPushSender | None = None,
              moment: datetime | None = None,
          ) -> BroadcastResult:
              if not get_bool_setting(db, "notifications_enabled"):
                  raise NotificationError("Notifications are disabled by operational settings")
              current = moment or datetime.now(UTC)
              targets = _target_users(
                  db,
                  audience=audience,
                  plan_code=plan_code,
                  user_ids=user_ids,
              )
              push_sender = sender or FCMPushSender()
              sent = failed = skipped = 0
              notifications_created = 0
              for user in targets:
                  notification = create_notification(
                      db,
                      user_id=user.id,
                      title=title,
                      body=body,
                      category=category,
                      data=data,
                      moment=current,
                  )
                  notifications_created += 1
                  devices = db.scalars(
                      select(PushDevice).where(
                          PushDevice.user_id == user.id,
                          PushDevice.enabled.is_(True),
                      )
                  ).all()
                  for device in devices:
                      status, message_id, error_code = push_sender.send(
                          token=_decrypt_token(device.encrypted_token),
                          title=title,
                          body=body,
                          data=data,
                      )
                      if status == "sent":
                          sent += 1
                          device.last_error = None
                      elif status == "failed":
                          failed += 1
                          device.last_error = error_code
                      else:
                          skipped += 1
                      db.add(
                          NotificationDelivery(
                              notification_id=notification.id,
                              push_device_id=device.id,
                              status=status,
                              provider_message_id=message_id,
                              error_code=error_code,
                              attempted_at=current,
                          )
                      )
              db.add(
                  CommunityAdminEvent(
                      actor_user_id=admin_user_id,
                      action="notification_broadcast",
                      details={
                          "audience": audience,
                          "plan_code": plan_code,
                          "targeted_users": len(targets),
                          "notifications_created": notifications_created,
                          "push_sent": sent,
                          "push_failed": failed,
                          "push_skipped": skipped,
                          "category": category,
                      },
                  )
              )
              db.flush()
              return BroadcastResult(
                  targeted_users=len(targets),
                  notifications_created=notifications_created,
                  push_sent=sent,
                  push_failed=failed,
                  push_skipped=skipped,
              )
          ''',
          'backend/app/services/admin_operations.py': '''from __future__ import annotations

          import time
          from datetime import UTC, datetime
          from uuid import UUID

          from sqlalchemy import func, or_, select
          from sqlalchemy.orm import Session

          from app.models import (
              CommunityAdminEvent,
              Discussion,
              DiscussionAppeal,
              DiscussionReport,
              Notification,
              PredictionVerification,
              ServiceHealthEvent,
              Subscription,
              User,
              WalletAccount,
          )
          from app.market_data.types import MarketDataProvider
          from sahmi_kasban.ai import AIProviderError, SahmiAIService


          def get_admin_overview(db: Session, *, moment: datetime | None = None) -> dict:
              current = moment or datetime.now(UTC)
              today_start = current.replace(hour=0, minute=0, second=0, microsecond=0)
              count = lambda model, *filters: int(
                  db.scalar(select(func.count(model.id)).where(*filters)) or 0
              )
              return {
                  "users_total": count(User),
                  "users_active": count(User, User.status == "active"),
                  "users_suspended": count(User, User.status == "suspended"),
                  "discussions_pending": count(
                      Discussion, Discussion.status == "pending_review"
                  ),
                  "discussions_published": count(
                      Discussion, Discussion.status == "published"
                  ),
                  "discussions_hidden": count(
                      Discussion, Discussion.status == "hidden"
                  ),
                  "open_reports": count(
                      DiscussionReport, DiscussionReport.status == "open"
                  ),
                  "open_appeals": count(
                      DiscussionAppeal, DiscussionAppeal.status == "open"
                  ),
                  "verified_predictions": count(PredictionVerification),
                  "wallet_points_total": int(
                      db.scalar(select(func.coalesce(func.sum(WalletAccount.balance_points), 0)))
                      or 0
                  ),
                  "notifications_today": count(
                      Notification, Notification.sent_at >= today_start
                  ),
                  "unread_notifications": count(
                      Notification, Notification.read_at.is_(None)
                  ),
              }


          def list_admin_users(
              db: Session,
              *,
              query_text: str | None = None,
              status: str | None = None,
              limit: int = 20,
              offset: int = 0,
          ) -> tuple[list[dict], int]:
              wallet_balance = (
                  select(WalletAccount.balance_points)
                  .where(WalletAccount.user_id == User.id)
                  .correlate(User)
                  .scalar_subquery()
              )
              plan_code = (
                  select(Subscription.plan_code)
                  .where(
                      Subscription.user_id == User.id,
                      Subscription.status == "active",
                  )
                  .order_by(Subscription.started_at.desc())
                  .limit(1)
                  .correlate(User)
                  .scalar_subquery()
              )
              discussions_count = (
                  select(func.count(Discussion.id))
                  .where(Discussion.user_id == User.id)
                  .correlate(User)
                  .scalar_subquery()
              )
              filters = []
              cleaned = (query_text or "").strip()
              if cleaned:
                  like = f"%{cleaned}%"
                  filters.append(
                      or_(User.email.ilike(like), User.display_name.ilike(like))
                  )
              if status:
                  filters.append(User.status == status)
              total = int(db.scalar(select(func.count(User.id)).where(*filters)) or 0)
              rows = db.execute(
                  select(
                      User,
                      wallet_balance.label("balance_points"),
                      plan_code.label("plan_code"),
                      discussions_count.label("discussions_count"),
                  )
                  .where(*filters)
                  .order_by(User.created_at.desc(), User.id.desc())
                  .limit(limit)
                  .offset(offset)
              ).all()
              return [
                  {
                      "id": row[0].id,
                      "email": row[0].email,
                      "display_name": row[0].display_name,
                      "status": row[0].status,
                      "plan_code": row[2] or "free",
                      "balance_points": int(row[1] or 0),
                      "discussions_count": int(row[3] or 0),
                      "created_at": row[0].created_at,
                  }
                  for row in rows
              ], total


          def list_admin_audit_events(
              db: Session,
              *,
              action: str | None = None,
              limit: int = 50,
              offset: int = 0,
          ) -> tuple[list[CommunityAdminEvent], int]:
              filters = []
              if action:
                  filters.append(CommunityAdminEvent.action == action)
              total = int(
                  db.scalar(select(func.count(CommunityAdminEvent.id)).where(*filters))
                  or 0
              )
              items = db.scalars(
                  select(CommunityAdminEvent)
                  .where(*filters)
                  .order_by(
                      CommunityAdminEvent.created_at.desc(),
                      CommunityAdminEvent.id.desc(),
                  )
                  .limit(limit)
                  .offset(offset)
              ).all()
              return list(items), total


          def record_service_health(
              db: Session,
              *,
              component: str,
              provider: str,
              status: str,
              latency_ms: int | None,
              details: dict,
              moment: datetime | None = None,
          ) -> ServiceHealthEvent:
              event = ServiceHealthEvent(
                  component=component,
                  provider=provider,
                  status=status,
                  latency_ms=latency_ms,
                  details=details,
                  observed_at=moment or datetime.now(UTC),
              )
              db.add(event)
              db.flush()
              return event


          def list_latest_service_health(db: Session) -> list[ServiceHealthEvent]:
              components = db.scalars(
                  select(ServiceHealthEvent.component).distinct()
              ).all()
              result: list[ServiceHealthEvent] = []
              for component in components:
                  item = db.scalar(
                      select(ServiceHealthEvent)
                      .where(ServiceHealthEvent.component == component)
                      .order_by(
                          ServiceHealthEvent.observed_at.desc(),
                          ServiceHealthEvent.id.desc(),
                      )
                      .limit(1)
                  )
                  if item is not None:
                      result.append(item)
              return sorted(result, key=lambda item: item.component)


          async def probe_service_health(
              db: Session,
              *,
              market_provider: MarketDataProvider,
              ai_service: SahmiAIService,
          ) -> list[ServiceHealthEvent]:
              market_start = time.perf_counter()
              try:
                  series = await market_provider.get_history(
                      "COMI", period="1mo", interval="1d"
                  )
                  market_status = "healthy" if series.candle_count >= 5 else "degraded"
                  record_service_health(
                      db,
                      component="market_data",
                      provider=series.provider,
                      status=market_status,
                      latency_ms=int((time.perf_counter() - market_start) * 1000),
                      details={
                          "ticker": series.ticker,
                          "candle_count": series.candle_count,
                          "data_as_of": series.data_as_of.isoformat(),
                      },
                  )
              except Exception as exc:  # provider boundary
                  record_service_health(
                      db,
                      component="market_data",
                      provider=getattr(market_provider, "name", "configured"),
                      status="failed",
                      latency_ms=int((time.perf_counter() - market_start) * 1000),
                      details={"error": type(exc).__name__, "message": str(exc)[:300]},
                  )

              ai_start = time.perf_counter()
              try:
                  response = await ai_service.client.chat(
                      [{"role": "user", "content": "Reply with OK only."}],
                      temperature=0.0,
                      max_tokens=8,
                  )
                  record_service_health(
                      db,
                      component="ai",
                      provider="configured_ai",
                      status="healthy" if response.strip() else "degraded",
                      latency_ms=int((time.perf_counter() - ai_start) * 1000),
                      details={"response_received": bool(response.strip())},
                  )
              except AIProviderError as exc:
                  record_service_health(
                      db,
                      component="ai",
                      provider="configured_ai",
                      status="failed",
                      latency_ms=int((time.perf_counter() - ai_start) * 1000),
                      details={"error": type(exc).__name__, "message": str(exc)[:300]},
                  )
              db.flush()
              return list_latest_service_health(db)
          ''',
          'backend/app/api/routes/notifications.py': '''from __future__ import annotations

          from uuid import UUID

          from fastapi import APIRouter, HTTPException, Query, status

          from app.api.dependencies import CurrentUser, DatabaseSession
          from app.schemas.operations import (
              NotificationListResponse,
              NotificationReadAllResponse,
              NotificationReadResponse,
              NotificationResponse,
              PushDeviceRegisterRequest,
              PushDeviceResponse,
              PushDeviceUnregisterRequest,
          )
          from app.services.notifications import (
              NotificationNotFoundError,
              list_user_notifications,
              mark_all_notifications_read,
              mark_notification_read,
              register_push_device,
              unregister_push_device,
          )

          router = APIRouter(prefix="/notifications", tags=["notifications"])


          def _notification_response(item) -> NotificationResponse:
              return NotificationResponse(
                  id=item.id,
                  title=item.title,
                  body=item.body,
                  category=item.category,
                  data=item.data,
                  read_at=item.read_at,
                  sent_at=item.sent_at,
              )


          @router.post("/devices", response_model=PushDeviceResponse)
          def register_device(
              payload: PushDeviceRegisterRequest,
              db: DatabaseSession,
              current_user: CurrentUser,
          ) -> PushDeviceResponse:
              result = register_push_device(
                  db,
                  user_id=current_user.id,
                  token=payload.token,
                  platform=payload.platform,
              )
              db.commit()
              return PushDeviceResponse(
                  id=result.device.id,
                  platform=result.device.platform,
                  enabled=result.device.enabled,
                  last_seen_at=result.device.last_seen_at,
                  idempotent=result.idempotent,
              )


          @router.post("/devices/unregister", response_model=PushDeviceResponse)
          def unregister_device(
              payload: PushDeviceUnregisterRequest,
              db: DatabaseSession,
              current_user: CurrentUser,
          ) -> PushDeviceResponse:
              changed = unregister_push_device(
                  db,
                  user_id=current_user.id,
                  token=payload.token,
              )
              db.commit()
              return PushDeviceResponse(
                  id=UUID(int=0),
                  platform="android",
                  enabled=False,
                  last_seen_at=current_user.updated_at,
                  idempotent=not changed,
              )


          @router.get("", response_model=NotificationListResponse)
          def notification_inbox(
              db: DatabaseSession,
              current_user: CurrentUser,
              limit: int = Query(default=20, ge=1, le=100),
              offset: int = Query(default=0, ge=0),
          ) -> NotificationListResponse:
              items, total, unread = list_user_notifications(
                  db,
                  user_id=current_user.id,
                  limit=limit,
                  offset=offset,
              )
              return NotificationListResponse(
                  items=[_notification_response(item) for item in items],
                  total=total,
                  unread_count=unread,
                  limit=limit,
                  offset=offset,
              )


          @router.post("/{notification_id}/read", response_model=NotificationReadResponse)
          def read_notification(
              notification_id: UUID,
              db: DatabaseSession,
              current_user: CurrentUser,
          ) -> NotificationReadResponse:
              try:
                  item, idempotent = mark_notification_read(
                      db,
                      user_id=current_user.id,
                      notification_id=notification_id,
                  )
                  db.commit()
              except NotificationNotFoundError as exc:
                  db.rollback()
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail=str(exc),
                  ) from exc
              return NotificationReadResponse(
                  notification_id=item.id,
                  read=True,
                  idempotent=idempotent,
              )


          @router.post("/read-all", response_model=NotificationReadAllResponse)
          def read_all_notifications(
              db: DatabaseSession,
              current_user: CurrentUser,
          ) -> NotificationReadAllResponse:
              updated = mark_all_notifications_read(db, user_id=current_user.id)
              db.commit()
              return NotificationReadAllResponse(updated=updated)
          ''',
          'backend/app/api/routes/admin_operations.py': '''from __future__ import annotations

