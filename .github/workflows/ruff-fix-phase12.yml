name: Ruff Fix Phase 12

on:
  push:
    branches:
      - agent/free-ads-stock-comparison-v2
    paths:
      - .github/workflows/ruff-fix-phase12.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-ads-stock-comparison-v2

      - name: Apply repository Ruff rules
        run: |
          python -m pip install --quiet ruff
          ruff check --fix backend/app/models/comparisons.py
          ruff format backend/app/models/comparisons.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ruff-fix-phase12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff formatting to comparison model"
          git push origin HEAD:agent/free-ads-stock-comparison-v2
