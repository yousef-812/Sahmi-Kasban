name: Phase 5 Ruff Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Print concise Ruff findings
        shell: bash
        run: |
          python -m pip install -q 'ruff>=0.7'
          cd backend
          ruff check app tests alembic/env.py scripts reusable_data_fetcher.py \
            --config pyproject.toml --output-format concise
