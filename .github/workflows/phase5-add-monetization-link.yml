name: Phase 5 Monetization Navigation

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-navigation:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Add wallet monetization link and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/lib/features/home/dashboard_screen.dart')
          text = path.read_text()
          needle = '''                    OutlinedButton.icon(
                      onPressed: () => context.push('/wallet/history'),
                      icon: const Icon(Icons.receipt_long_outlined),
                      label: const Text('عرض سجل العمليات'),
                    ),
          '''
          replacement = needle + '''                    const SizedBox(height: 10),
                    FilledButton.icon(
                      onPressed: () => context.push('/monetization'),
                      icon: const Icon(Icons.workspace_premium_outlined),
                      label: const Text('الخطط وشراء العملات'),
                    ),
          '''
          if needle not in text:
              raise SystemExit('Wallet history button block was not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          rm .github/workflows/phase5-add-monetization-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link wallet to monetization screen'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
