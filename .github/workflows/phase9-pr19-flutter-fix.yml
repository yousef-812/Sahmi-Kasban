name: Phase 9 PR19 Flutter Fix

on:
  push:
    paths:
      - PHASE9_PR19_FLUTTER_FIX_TRIGGER.md

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/agent/phase-9-performance-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9-performance-experience
          fetch-depth: 0
      - name: Fix TextDirection and format
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/performance/performance_report_screen.dart')
          text = path.read_text()
          if "import 'dart:ui' as ui;" not in text:
              text = "import 'dart:ui' as ui;\n\n" + text
          text = text.replace('textDirection: TextDirection.ltr,', 'textDirection: ui.TextDirection.ltr,')
          path.write_text(text)
          PY
          FLUTTER_HOME="$GITHUB_WORKSPACE/.github/.cache/flutter"
          if [ ! -x "$FLUTTER_HOME/bin/dart" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib/features/performance/performance_report_screen.dart
          rm -f PHASE9_FLUTTER_ANALYZE.txt
          rm -f PHASE9_PR19_FLUTTER_FIX_TRIGGER.md
          rm -f .github/workflows/phase9-pr19-flutter-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR19 Flutter analysis"
          git push origin HEAD:agent/phase-9-performance-experience
