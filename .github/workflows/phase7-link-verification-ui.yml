name: Phase 7 Verification UI Linker

on:
  pull_request:

permissions:
  contents: write

jobs:
  link-verification:
    if: github.head_ref == 'agent/phase-7-prediction-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Link verification card and format Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/lib/features/community/community_detail_screen.dart')
          text = path.read_text()
          import_anchor = "import 'community_repository.dart';\n"
          import_line = "import 'prediction_verification_card.dart';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Community detail import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          block_anchor = '''                if (item.moderationResult.isNotEmpty && isOwner) ...[
          '''
          verification_block = '''                if (isOwner && item.status == 'published') ...[
                            const SizedBox(height: 14),
                            PredictionVerificationCard(discussionId: item.id),
                          ],
          '''
          if verification_block not in text:
              if block_anchor not in text:
                  raise SystemExit('Community detail verification anchor not found')
              text = text.replace(block_anchor, verification_block + block_anchor, 1)
          path.write_text(text)
          PY
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib mobile/test
          rm .github/workflows/phase7-link-verification-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link Phase 7 verification UI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
