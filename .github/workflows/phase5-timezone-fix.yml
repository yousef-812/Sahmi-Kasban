name: Phase 5 Timezone Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-timezone-fix:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Normalize database timestamps and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/monetization.py')
          text = path.read_text()
          text = text.replace(
              'next_available_at = last_reward_at + timedelta(',
              'next_available_at = _as_utc(last_reward_at) + timedelta(',
          )
          text = text.replace(
              'if session.expires_at < now:',
              'if _as_utc(session.expires_at) < now:',
          )
          marker = '\ndef _parse_admob_timestamp(value: str) -> datetime:\n'
          helper = '''\ndef _as_utc(value: datetime) -> datetime:\n    if value.tzinfo is None:\n        return value.replace(tzinfo=UTC)\n    return value.astimezone(UTC)\n\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)
          path.write_text(text)
          PY
          rm .github/workflows/phase5-timezone-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize monetization database timestamps'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
