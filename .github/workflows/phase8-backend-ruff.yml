name: Phase 8 Backend Ruff Pass

on:
  push:
    branches:
      - agent/phase-8-admin-notifications
    paths:
      - PHASE8_BACKEND_RUFF_TRIGGER.md

permissions:
  contents: write

jobs:
  backend-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-admin-notifications
          fetch-depth: 0
      - run: python -m pip install ruff
      - name: Apply backend-local Ruff configuration
        working-directory: backend
        run: |
          ruff check --fix .
          ruff check .
      - name: Commit exact backend Ruff output
        run: |
          rm PHASE8_BACKEND_RUFF_TRIGGER.md
          rm .github/workflows/phase8-backend-ruff.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/phase8-backend-ruff.yml PHASE8_BACKEND_RUFF_TRIGGER.md
          git commit -m "Apply backend-scoped Ruff formatting"
          git push origin HEAD:agent/phase-8-admin-notifications
