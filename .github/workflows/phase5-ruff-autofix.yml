name: Phase 5 Ruff Autofix

on:
  pull_request:

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply Ruff fixes and remove temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q 'ruff>=0.7'
          cd backend
          ruff check app tests alembic/env.py scripts reusable_data_fetcher.py \
            --config pyproject.toml --fix
          cd ..
          rm -f PHASE5_RUFF_TEMP.txt
          rm .github/workflows/phase5-ruff-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Phase 5 Ruff fixes'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
