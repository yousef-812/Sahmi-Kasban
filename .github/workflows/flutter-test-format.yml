name: Format Final Flutter Tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.head_ref == 'agent/flutter-core-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-test-format
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-test-format
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Format Flutter source and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          "$FLUTTER_HOME/bin/dart" format lib test >/dev/null
          cd ..
          rm -f .github/workflows/flutter-test-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Flutter source is already formatted."
            exit 0
          fi
          git commit -m "Format final Flutter tests"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
