name: Phase 5 Logic Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-logic-fix:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Preserve free fallback and assign purchase IDs early
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/monetization.py')
          text = path.read_text()
          text = text.replace('from uuid import UUID\n', 'from uuid import UUID, uuid4\n')
          text = text.replace(
              'purchase = BillingPurchase(\n        user_id=user_id,',
              'purchase = BillingPurchase(\n        id=uuid4(),\n        user_id=user_id,',
          )
          text = text.replace(
              'Subscription.user_id == user_id,\n            Subscription.status == "active",\n        )',
              'Subscription.user_id == user_id,\n            Subscription.status == "active",\n            Subscription.plan_code != "free",\n        )',
              1,
          )
          path.write_text(text)
          PY
          rm .github/workflows/phase5-logic-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve free fallback for paid plans'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
