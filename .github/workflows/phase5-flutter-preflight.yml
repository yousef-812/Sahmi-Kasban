name: Phase 5 Flutter Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  flutter-preflight:
    if: github.head_ref == 'agent/phase-5-monetization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-phase5
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-phase5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply deterministic fixes, resolve packages, and format
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('backend/app/core/config.py')
          text = config.read_text()
          text = text.replace(
              'google_play_package_name: str = "com.sahmikasban.app"',
              'google_play_package_name: str = "com.sahmikasban.sahmi_kasban_mobile"',
          )
          config.write_text(text)

          service = Path('backend/app/services/monetization.py')
          text = service.read_text()
          needle = '''    current_settings = settings or get_settings()
    now = moment or datetime.now(UTC)
    eligibility = rewarded_ad_eligibility(
'''
          replacement = '''    current_settings = settings or get_settings()
    if current_settings.admob_ssv_verification_mode == "disabled":
        raise RewardedAdsUnavailableError("verification_disabled")
    now = moment or datetime.now(UTC)
    eligibility = rewarded_ad_eligibility(
'''
          if needle not in text:
              raise SystemExit('Rewarded session service insertion point not found')
          service.write_text(text.replace(needle, replacement, 1))

          controller = Path('mobile/lib/features/monetization/monetization_controller.dart')
          text = controller.read_text()
          text = text.replace(
              '''            );
          }
        case PurchaseStatus.error:
''',
              '''            );
          }
          break;
        case PurchaseStatus.error:
''',
              1,
          )
          text = text.replace(
              '''            );
          }
        case PurchaseStatus.canceled:
''',
              '''            );
          }
          break;
        case PurchaseStatus.canceled:
''',
              1,
          )
          text = text.replace(
              '''            );
          }
        case PurchaseStatus.purchased:
''',
              '''            );
          }
          break;
        case PurchaseStatus.purchased:
''',
              1,
          )
          text = text.replace(
              '''        case PurchaseStatus.restored:
          await _verifyAndComplete(purchase);
      }
''',
              '''        case PurchaseStatus.restored:
          await _verifyAndComplete(purchase);
          break;
      }
''',
              1,
          )
          controller.write_text(text)
          PY
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get
          "$FLUTTER_HOME/bin/dart" format lib test
          cd ..
          rm .github/workflows/phase5-flutter-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Phase 5 Flutter monetization integration'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
