name: Phase 7 Roadmap CI Gate Recorder

on:
  pull_request:

permissions:
  contents: write

jobs:
  record-gate:
    if: github.head_ref == 'agent/phase-7-prediction-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Record successful Phase 7 gate and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()
          replacements = {
              '> بوابة الدمج: نجاح CI النهائي على آخر commit عادي في PR #16': (
                  '> بوابة التحقق: Lint وBackend/PostgreSQL/Alembic وFlutter وAPK '
                  'اجتازت بوابة كاملة على PR #16'
              ),
              '- [ ] نجاح CI النهائي وبناء Android APK على آخر commit عادي قبل الدمج.': (
                  '- [x] نجاح CI الكامل وبناء Android APK على PR #16 — '
                  'Workflow `30183634855`.'
              ),
              '- [x] تقييم التوقعات والمكافآت — مكتملة برمجيًا على PR #16؛ الدمج ينتظر بوابة CI النهائية.': (
                  '- [x] تقييم التوقعات والمكافآت — مكتملة ومتحققة على PR #16؛ '
                  'المرحلة 8 هي التالية.'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Roadmap gate anchor not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase7-roadmap-ci-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Phase 7 validation gate'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
