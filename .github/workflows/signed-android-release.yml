name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require protected signing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure Firebase Android app
        if: ${{ env.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          python -m json.tool mobile/android/app/google-services.json >/dev/null

      - name: Configure stable Android signing
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/upload-keystore.jks
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          keytool -list -keystore mobile/android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install Flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics

      - name: Fetch Flutter packages
        working-directory: mobile
        run: $FLUTTER_HOME/bin/flutter pub get

      - name: Build signed update APK
        working-directory: mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          $FLUTTER_HOME/bin/flutter build apk --release \
            --dart-define=API_BASE_URL=https://sahmi-kasban.fly.dev \
            --dart-define=DEMO_MODE=false \
            --dart-define=APP_ENV=staging

      - name: Verify update package and signing certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="mobile/build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"

          badging="$($aapt dump badging "$apk" | head -n 1)"
          package_id="$(printf '%s\n' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [ "$package_id" != "com.sahmikasban.sahmi_kasban_mobile" ]; then
            echo "Signed update has unexpected package ID: $package_id" >&2
            exit 1
          fi

          keytool -printcert -jarfile "$apk" \
            | tee mobile/build/app/outputs/flutter-apk/signing-certificate.txt
          cert_sha256="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            mobile/build/app/outputs/flutter-apk/signing-certificate.txt | head -n 1)"
          test -n "$cert_sha256"

          normalize() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'
          }
          if [ -n "${ANDROID_EXPECTED_CERT_SHA256:-}" ] && \
             [ "$(normalize "$cert_sha256")" != "$(normalize "$ANDROID_EXPECTED_CERT_SHA256")" ]; then
            echo "Signing certificate does not match ANDROID_EXPECTED_CERT_SHA256" >&2
            exit 1
          fi

          safe_version="${version_name//+/-}"
          output="mobile/build/app/outputs/flutter-apk/sahmi-kasban-${safe_version}-${version_code}-signed-update.apk"
          cp "$apk" "$output"
          cat > mobile/build/app/outputs/flutter-apk/release-metadata.txt <<EOF
          package_id=$package_id
          version_name=$version_name
          version_code=$version_code
          certificate_sha256=$cert_sha256
          source_commit=${GITHUB_SHA}
          EOF
          echo "SIGNED_UPDATE_APK=$output" >> "$GITHUB_ENV"

      - name: Upload signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: sahmi-kasban-signed-update-${{ github.run_id }}
          path: |
            ${{ env.SIGNED_UPDATE_APK }}
            mobile/build/app/outputs/flutter-apk/signing-certificate.txt
            mobile/build/app/outputs/flutter-apk/release-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected files
        if: always()
        shell: bash
        run: |
          rm -f mobile/android/app/upload-keystore.jks
          rm -f mobile/android/key.properties
          rm -f mobile/android/app/google-services.json
