name: Phase 6 Flutter Const Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-flutter-const:
    if: github.head_ref == 'agent/phase-6-community-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Fix non-const ListView calls and clean diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          detail = Path('mobile/lib/features/community/community_detail_screen.dart')
          text = detail.read_text()
          old = "loading: () => const ListView("
          if old not in text:
              raise SystemExit('Detail loading ListView anchor not found')
          detail.write_text(text.replace(old, "loading: () => ListView(", 1))

          mine = Path('mobile/lib/features/community/my_discussions_screen.dart')
          text = mine.read_text()
          old = "return const ListView("
          if old not in text:
              raise SystemExit('My Discussions loading ListView anchor not found')
          mine.write_text(text.replace(old, "return ListView(", 1))
          PY
          rm -f PHASE6_FLUTTER_ANALYZE.txt
          rm .github/workflows/phase6-fix-flutter-const.yml
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          "$FLUTTER_HOME/bin/dart" format mobile/lib mobile/test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Phase 6 Flutter analyzer errors'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
