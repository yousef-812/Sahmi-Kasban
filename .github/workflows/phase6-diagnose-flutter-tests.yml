name: Phase 6 Flutter Test Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose-flutter-tests:
    if: github.head_ref == 'agent/phase-6-community-core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Capture Flutter test output
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          set +e
          "$FLUTTER_HOME/bin/flutter" test --reporter expanded > ../PHASE6_FLUTTER_TESTS.txt 2>&1
          status=$?
          set -e
          cd ..
          printf '\nexit_status=%s\n' "$status" >> PHASE6_FLUTTER_TESTS.txt
          rm .github/workflows/phase6-diagnose-flutter-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE6_FLUTTER_TESTS.txt .github/workflows/phase6-diagnose-flutter-tests.yml
          git commit -m 'Capture Phase 6 Flutter test diagnostics'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
