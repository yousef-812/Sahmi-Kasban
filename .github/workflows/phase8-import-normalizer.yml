name: Phase 8 Import Normalizer

on:
  push:
    branches:
      - agent/phase-8-admin-notifications
    paths:
      - PHASE8_IMPORT_TRIGGER.md

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-admin-notifications
          fetch-depth: 0
      - name: Restore CI-compatible first-party grouping
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          targets = [
              'backend/app/api/routes/admin_operations.py',
              'backend/app/api/routes/community.py',
              'backend/app/api/routes/community_verification.py',
              'backend/app/api/routes/market.py',
              'backend/app/services/admin_operations.py',
              'backend/app/services/community_ai.py',
              'backend/app/services/daily_reports.py',
              'backend/app/services/stock_analysis.py',
              'backend/tests/test_community_ai.py',
              'backend/tests/test_market_analysis_api.py',
              'backend/tests/test_prediction_verification_api.py',
          ]

          def module_name(node):
              if isinstance(node, ast.ImportFrom):
                  return node.module or ''
              if isinstance(node, ast.Import) and node.names:
                  return node.names[0].name
              return ''

          def move_sahmi_after_app(path: Path) -> None:
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              tree = ast.parse(source)
              sahmi_nodes = [
                  node for node in tree.body
                  if isinstance(node, (ast.Import, ast.ImportFrom))
                  and module_name(node).startswith('sahmi_kasban')
              ]
              if not sahmi_nodes:
                  return
              blocks = [
                  ''.join(lines[node.lineno - 1:node.end_lineno])
                  for node in sahmi_nodes
              ]
              for node in sorted(sahmi_nodes, key=lambda item: item.lineno, reverse=True):
                  del lines[node.lineno - 1:node.end_lineno]
              cleaned = ''.join(lines)
              tree = ast.parse(cleaned)
              app_nodes = [
                  node for node in tree.body
                  if isinstance(node, (ast.Import, ast.ImportFrom))
                  and module_name(node).startswith('app')
              ]
              if not app_nodes:
                  raise RuntimeError(f'No app import block in {path}')
              insertion = max(node.end_lineno for node in app_nodes)
              block = ''.join(blocks)
              lines = cleaned.splitlines(keepends=True)
              lines.insert(insertion, block)
              path.write_text(''.join(lines), encoding='utf-8')

          for target in targets:
              move_sahmi_after_app(Path(target))

          env_path = Path('backend/alembic/env.py')
          env_text = env_path.read_text(encoding='utf-8')
          env_text = env_text.replace(
              'from sqlalchemy import engine_from_config, pool\n\n'
              'from alembic import context\n'
              'from app import models as _models  # noqa: F401\n',
              'from alembic import context\n'
              'from sqlalchemy import engine_from_config, pool\n\n'
              'from app import models as _models  # noqa: F401\n',
          )
          env_path.write_text(env_text, encoding='utf-8')
          PY
      - name: Commit deterministic import layout
        run: |
          rm PHASE8_IMPORT_TRIGGER.md
          rm .github/workflows/phase8-import-normalizer.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/phase8-import-normalizer.yml PHASE8_IMPORT_TRIGGER.md
          git commit -m "Restore CI-compatible Backend import grouping"
          git push origin HEAD:agent/phase-8-admin-notifications
