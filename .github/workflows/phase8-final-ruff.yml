name: Phase 8 Final Ruff Pass

on:
  push:
    branches:
      - agent/phase-8-admin-notifications
    paths:
      - PHASE8_FINAL_RUFF_TRIGGER.md

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-admin-notifications
          fetch-depth: 0
      - run: python -m pip install ruff
      - run: ruff check --fix backend
      - run: ruff check backend
      - name: Commit exact Ruff output
        run: |
          rm PHASE8_FINAL_RUFF_TRIGGER.md
          rm .github/workflows/phase8-final-ruff.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/phase8-final-ruff.yml PHASE8_FINAL_RUFF_TRIGGER.md
          git commit -m "Apply final Phase 8 Ruff formatting"
          git push origin HEAD:agent/phase-8-admin-notifications
