name: Phase 9 PR19 Flutter Diagnostic

on:
  push:
    paths:
      - PHASE9_PR19_FLUTTER_TRIGGER.md

permissions:
  contents: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/agent/phase-9-performance-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9-performance-experience
          fetch-depth: 0
      - name: Capture Flutter analyzer findings
        shell: bash
        run: |
          set -Eeuo pipefail
          FLUTTER_HOME="$GITHUB_WORKSPACE/.github/.cache/flutter"
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          set +e
          "$FLUTTER_HOME/bin/flutter" analyze > ../PHASE9_FLUTTER_ANALYZE.txt 2>&1
          status=$?
          set -e
          cd ..
          python - <<'PY'
          from pathlib import Path
          path = Path('PHASE9_FLUTTER_ANALYZE.txt')
          lines = path.read_text(errors='replace').splitlines()
          findings = [
              line for line in lines
              if ' • ' in line or 'error - ' in line or 'warning - ' in line
          ]
          path.write_text('\n'.join(findings[-120:]) + '\n')
          PY
          rm -f PHASE9_PR19_FLUTTER_TRIGGER.md
          rm -f .github/workflows/phase9-pr19-flutter-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture PR19 Flutter analyzer findings"
          git push origin HEAD:agent/phase-9-performance-experience
