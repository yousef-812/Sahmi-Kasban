name: Finalize Flutter Branding

on:
  pull_request:

permissions:
  contents: write

jobs:
  brand-and-format:
    if: github.head_ref == 'agent/flutter-core-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_HOME: ${{ github.workspace }}/.github/.cache/flutter-branding
      PUB_CACHE: ${{ github.workspace }}/.github/.cache/pub-branding
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Generate launcher icons, splash artwork, and format source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw

          root = Path('mobile')
          branding = root / 'assets' / 'branding'
          branding.mkdir(parents=True, exist_ok=True)

          size = 1024
          icon = Image.new('RGB', (size, size))
          pixels = icon.load()
          top = (7, 77, 48)
          bottom = (12, 126, 73)
          for y in range(size):
              ratio = y / (size - 1)
              color = tuple(round(a + (b - a) * ratio) for a, b in zip(top, bottom))
              for x in range(size):
                  pixels[x, y] = color

          draw = ImageDraw.Draw(icon)
          for step in (256, 512, 768):
              draw.line((96, step, 928, step), fill=(255, 255, 255, 25), width=4)
              draw.line((step, 96, step, 928), fill=(255, 255, 255, 25), width=4)

          bars = [(210, 650, 320, 820), (380, 530, 490, 820), (550, 590, 660, 820), (720, 350, 830, 820)]
          for box in bars:
              draw.rounded_rectangle(box, radius=30, fill=(247, 250, 248))

          points = [(170, 610), (365, 465), (545, 535), (805, 250)]
          draw.line(points, fill=(246, 190, 63), width=48, joint='curve')
          for x, y in points:
              draw.ellipse((x - 28, y - 28, x + 28, y + 28), fill=(246, 190, 63))
          draw.polygon([(805, 250), (722, 268), (786, 335)], fill=(246, 190, 63))
          icon.save(branding / 'app_icon.png', optimize=True)

          symbol = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          symbol_draw = ImageDraw.Draw(symbol)
          symbol_bars = [(70, 305, 135, 420), (170, 235, 235, 420), (270, 275, 335, 420), (370, 130, 435, 420)]
          for box in symbol_bars:
              symbol_draw.rounded_rectangle(box, radius=18, fill=(255, 255, 255, 255))
          symbol_points = [(50, 280), (165, 195), (270, 235), (430, 75)]
          symbol_draw.line(symbol_points, fill=(246, 190, 63, 255), width=28, joint='curve')
          for x, y in symbol_points:
              symbol_draw.ellipse((x - 16, y - 16, x + 16, y + 16), fill=(246, 190, 63, 255))
          symbol_draw.polygon([(430, 75), (380, 86), (420, 126)], fill=(246, 190, 63, 255))
          symbol.save(branding / 'splash_symbol.png', optimize=True)

          android_sizes = {
              'mipmap-mdpi/ic_launcher.png': 48,
              'mipmap-hdpi/ic_launcher.png': 72,
              'mipmap-xhdpi/ic_launcher.png': 96,
              'mipmap-xxhdpi/ic_launcher.png': 144,
              'mipmap-xxxhdpi/ic_launcher.png': 192,
          }
          android_res = root / 'android' / 'app' / 'src' / 'main' / 'res'
          for relative, target_size in android_sizes.items():
              output = android_res / relative
              icon.resize((target_size, target_size), Image.Resampling.LANCZOS).save(output, optimize=True)

          launch_logo = symbol.resize((256, 256), Image.Resampling.LANCZOS)
          launch_logo.save(android_res / 'drawable' / 'launch_logo.png', optimize=True)
          launch_logo.save(android_res / 'drawable-v21' / 'launch_logo.png', optimize=True)
          launch_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#074D30" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/launch_logo" />
              </item>
          </layer-list>
          '''
          (android_res / 'drawable' / 'launch_background.xml').write_text(launch_xml)
          (android_res / 'drawable-v21' / 'launch_background.xml').write_text(launch_xml)

          app_icons = root / 'ios' / 'Runner' / 'Assets.xcassets' / 'AppIcon.appiconset'
          pattern = re.compile(r'Icon-App-(\d+(?:\.\d+)?)x\d+(?:\.\d+)?@(\d+)x\.png')
          for output in app_icons.glob('Icon-App-*.png'):
              match = pattern.fullmatch(output.name)
              if not match:
                  continue
              target_size = round(float(match.group(1)) * int(match.group(2)))
              icon.resize((target_size, target_size), Image.Resampling.LANCZOS).save(output, optimize=True)

          launch_set = root / 'ios' / 'Runner' / 'Assets.xcassets' / 'LaunchImage.imageset'
          launch_sizes = {
              'LaunchImage.png': (168, 185),
              'LaunchImage@2x.png': (336, 370),
              'LaunchImage@3x.png': (504, 555),
          }
          for filename, canvas_size in launch_sizes.items():
              canvas = Image.new('RGBA', canvas_size, (0, 0, 0, 0))
              logo_size = min(canvas_size) * 3 // 4
              logo = symbol.resize((logo_size, logo_size), Image.Resampling.LANCZOS)
              canvas.alpha_composite(
                  logo,
                  ((canvas_size[0] - logo_size) // 2, (canvas_size[1] - logo_size) // 2),
              )
              canvas.save(launch_set / filename, optimize=True)

          storyboard = root / 'ios' / 'Runner' / 'Base.lproj' / 'LaunchScreen.storyboard'
          content = storyboard.read_text()
          content = content.replace(
              '<color key="backgroundColor" red="1" green="1" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>',
              '<color key="backgroundColor" red="0.027" green="0.302" blue="0.188" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>',
          )
          storyboard.write_text(content)
          PY
          cd mobile
          "$FLUTTER_HOME/bin/flutter" pub get >/dev/null
          "$FLUTTER_HOME/bin/dart" format lib test >/dev/null
          cd ..
          rm -f .github/workflows/flutter-brand-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Branding and formatting are already current."
            exit 0
          fi
          git commit -m "Finalize Flutter branding and source formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
