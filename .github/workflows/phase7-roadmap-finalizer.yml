name: Phase 7 Roadmap Finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-roadmap:
    if: github.head_ref == 'agent/phase-7-prediction-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Mark Phase 7 complete and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()
          old_header = '''> النسخة: 1.5  
          > الحالة: المرحلة 6 مكتملة ومتحققة على PR #15، والمرحلة 7 هي التالية  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #15: 0، 1، 2، 3، 4، 5  
          > المرحلة المكتملة على PR #15: 6 — المجتمع والمناقشات  
          > المرحلة التالية: 7 — تقييم التوقعات والمكافآت  
          > بوابة التحقق الأخيرة: Workflow `30179575341` — Lint وBackend/PostgreSQL/Alembic وFlutter وAPK كلها خضراء
          '''
          new_header = '''> النسخة: 1.6  
          > الحالة: المرحلة 7 مكتملة برمجيًا على PR #16، والمرحلة 8 هي التالية  
          > النطاق: تطبيق Flutter + Backend Python + PostgreSQL + محركات التحليل + الذكاء الاصطناعي + المجتمع + تحقيق الدخل
          > آخر تحديث تنفيذي: 2026-07-26  
          > المراحل المكتملة والمدمجة قبل PR #16: 0، 1، 2، 3، 4، 5، 6  
          > المرحلة المكتملة على PR #16: 7 — تقييم التوقعات والمكافآت  
          > المرحلة التالية: 8 — لوحة الإدارة والإشعارات  
          > بوابة الدمج: نجاح CI النهائي على آخر commit عادي في PR #16
          '''
          if old_header not in text:
              raise SystemExit('Roadmap header block not found')
          text = text.replace(old_header, new_header, 1)

          old_phase = '''## المرحلة 7 — تقييم التوقعات

          ### الأعمال

          - استخراج التوقع وتجميده.
          - إظهار زر التحقق في الموعد الصحيح.
          - جلب بيانات الفترة الفعلية.
          - الحساب الرقمي للمستوى.
          - شرح AI.
          - توزيع المكافأة.
          - تحديث إحصاءات المستخدم.

          ### معيار الاكتمال

          - لا يمكن تقييم التوقع قبل انتهاء مدته.
          - لا يمكن الحصول على المكافأة مرتين.
          - المكافأة ناتجة من قواعد السيرفر وليس نص AI.
          '''
          new_phase = '''## المرحلة 7 — تقييم التوقعات والمكافآت ✅ مكتملة برمجيًا

          ### المنجز على PR #16

          - [x] الاحتفاظ بالتوقع المجمد وقت النشر وعدم الاعتماد على نص قابل للتعديل.
          - [x] حساب أهلية التحقق حسب جلسات EGX وتوقيت `Africa/Cairo` لفترات جلسة وأسبوع وشهر.
          - [x] منع التحقق قبل 5:00 مساءً في آخر جلسة مستهدفة.
          - [x] جلب شموع الفترة النهائية ورفض النتيجة الجزئية عند نقص أي جلسة.
          - [x] تطبيق أوزان ثابتة: الاتجاه 40%، الهدف 30%، التوقيت والمسار 20%، والتحديد 10%.
          - [x] مستويات المكافآت الثابتة: 0، 50، 100، و200 نقطة.
          - [x] منع التوقع العام من الحصول على مستوى `very_strong` دون هدف أو توقيت أو مسار محدد.
          - [x] استخدام AI للشرح فقط مع تجاهل أي مستوى أو مكافأة يقترحها.
          - [x] مسار شرح عربي ثابت عند فشل مزود AI دون تغيير الدرجة أو المكافأة.
          - [x] سجل `PredictionVerification` واحد لكل مناقشة ومكافأة Wallet Ledger بمعرّف ثابت.
          - [x] APIs لحالة التحقق والتنفيذ وإحصاءات المستخدم.
          - [x] Flutter لزر التحقق وموعد الأهلية والنتيجة والمكافأة وإحصاءات «مناقشاتي».
          - [x] اختبارات Backend/API وFlutter models/repository/widgets والتزامن المنطقي للتكرار.

          ### معيار الاكتمال

          - [x] لا يمكن تقييم التوقع قبل انتهاء مدته.
          - [x] لا يمكن الحصول على المكافأة مرتين حتى مع إعادة الطلب.
          - [x] المكافأة ناتجة من قواعد السيرفر وليس نص AI.
          - [x] نقص بيانات الإغلاق لا ينشئ تقييمًا أو مكافأة جزئية.
          - [x] واجهة Flutter لا تحسب الدرجة أو تعدل الرصيد محليًا.
          - [ ] نجاح CI النهائي وبناء Android APK على آخر commit عادي قبل الدمج.
          '''
          if old_phase not in text:
              raise SystemExit('Phase 7 roadmap block not found')
          text = text.replace(old_phase, new_phase, 1)

          old_status = '- [ ] تقييم التوقعات والمكافآت — المرحلة 7 هي التالية بعد دمج PR #15.'
          new_status = '- [x] تقييم التوقعات والمكافآت — مكتملة برمجيًا على PR #16؛ الدمج ينتظر بوابة CI النهائية.'
          if old_status not in text:
              raise SystemExit('Phase 7 component status not found')
          path.write_text(text.replace(old_status, new_status, 1))
          PY
          rm .github/workflows/phase7-roadmap-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update roadmap for Phase 7 completion'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
