name: sahmi_kasban_mobile
description: Arabic-first Flutter client for the Sahmi Kasban backend.
publish_to: none
version: 0.9.8+24

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  google_mobile_ads: ^9.0.0
  local_auth: ^2.2.0
  in_app_purchase: ^3.3.0
  intl: ^0.20.2
  webview_flutter: ^4.10.0
  sentry_flutter: ^9.25.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/branding/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 100
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 100
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 200
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 800
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 900
