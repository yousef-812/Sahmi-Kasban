app = "sahmi-kasban"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "python -m alembic upgrade head"
  release_command_timeout = "10m"
  strategy = "rolling"
  wait_timeout = "10m"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
  replay = "python -m app.workers.historical_replay"

[env]
  APP_ENV = "staging"
  DEBUG = "false"
  PORT = "8080"
  APP_PUBLIC_URL = "https://sahmi-kasban.bdaey.com"
  CORS_ORIGINS = "https://sahmi-kasban.bdaey.com,https://sahmi-kasban.fly.dev"
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"
  SENTRY_RELEASE = "sahmi-kasban-backend@0.10.3"
  SENTRY_TRACES_SAMPLE_RATE = "0.10"
  REQUEST_SLOW_THRESHOLD_MS = "1500"
  QUALITY_ERROR_RATE_ALERT_PERCENT = "5"
  QUALITY_P95_LATENCY_ALERT_MS = "1000"
  MARKET_TIMEZONE = "Africa/Cairo"
  ANALYSIS_ENGINE_VERSION = "core-v2.5"
  HISTORICAL_REPLAY_PROVIDER_CONCURRENCY = "5"
  HISTORICAL_REPLAY_CPU_CONCURRENCY = "2"
  HISTORICAL_REPLAY_CACHE_HOURS = "24"
  HISTORICAL_REPLAY_PREPARED_CACHE_ENTRIES = "320"
  HISTORICAL_REPLAY_ACTIVE_POLL_SECONDS = "0.5"
  HISTORICAL_REPLAY_IDLE_POLL_SECONDS = "5"
  DAILY_SCAN_SCHEDULER_ENABLED = "true"
  DAILY_SCAN_SCHEDULER_POLL_SECONDS = "300"
  DAILY_SCAN_HOUR = "15"
  WEEKLY_GRANT_SCHEDULER_ENABLED = "true"
  WEEKLY_GRANT_SCHEDULER_POLL_SECONDS = "3600"
  AI_MODEL = "llama-3.3-70b-versatile"
  AI_TIMEOUT_SECONDS = "45"
  AI_MAX_TOKENS = "1800"
  AI_TEMPERATURE = "0.2"
  FCM_DELIVERY_MODE = "live"
  FCM_PROJECT_ID = "project-f14e453c-deb8-4a94-b39"
  GOOGLE_PLAY_VERIFICATION_MODE = "disabled"
  ADMOB_SSV_VERIFICATION_MODE = "disabled"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  processes = ["api"]
  grace_period = "45s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/v1/health/ready"
  protocol = "http"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
  cpu_kind = "shared"

[[vm]]
  processes = ["replay"]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
  cpu_kind = "shared"
